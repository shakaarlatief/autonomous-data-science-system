[project]
name = "autonomous-data-science-system"
version = "0.1.0"
description = "Professional interactive system for rigorous, adaptive data-science project execution and methodological navigation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.52,<2.1",
    "alembic>=1.19,<2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.5"

[tool.uv.build-backend]
module-name = "ads_system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
