name: Reconcile Checkpoint 162 integration routing

on:
  push:
    branches: [v1-frontend-spike]
    paths:
      - .github/workflows/reconcile-checkpoint162-integration.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-frontend-spike
          fetch-depth: 1
      - name: Reconcile integration routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          current = Path('docs/CURRENT_STATE.md')
          text = current.read_text(encoding='utf-8')
          text = re.sub(
              r'^# Current State\n\n.*?\n## Active ChatGPT development context',
              '''# Current State\n\n**Checkpoint:** 162  \n**Date:** 2026-08-23  \n**Active development branch:** `v1-frontend-spike`  \n**Active PR:** none; Specification 018 PR #23 merged  \n**Promoted V1 integration branch:** `v1-frontend-spike` at Specification 018 promotion merge `9fd2243c38a8f0f010396847f519e115d30b8f58`  \n**Development stage:** Prototype V0 complete; bounded V1 has accepted project/object, persistence, methodological knowledge, Horizon/selective-context, real-reasoning, dependency-backed sequencing, and governed autonomous live-experiment launch seams. Specification 017 remains preserved incomplete evidence and its recommendation/action implementation remains unpromoted.  \n**Final V0 classification:** STRONG FALSIFICATION OF THE CURRENT P0 DESIGN  \n**Immediate project priority:** preregister the next recommendation/action-value experiment with system-owned exact context provenance before implementation or any new provider call.\n\n## Active ChatGPT development context''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'## Exact continuation\n\n```text\n.*?```\s*$',
              '''## Exact continuation\n\n```text\n1. branch from Specification 018 promotion merge 9fd2243c38a8f0f010396847f519e115d30b8f58\n2. preregister the next recommendation/action-value experiment\n3. preserve Specification 017 scientific truth without using partial scores for tuning\n4. make exact supplied-context provenance system-owned\n5. remove unnecessary model-authored provenance from structured-output validity\n6. freeze the new fixture, gates, call plan, and checkpoint before implementation\n7. implement provider-free and validate the exact head\n8. add one exact repository-controlled launch authorization\n9. launch through Specification 018 rather than a manual Actions button\n10. make no new recommendation/action provider call before steps 2-8 are frozen and green\n```''',
              text,
              count=1,
              flags=re.S,
          )
          current.write_text(text, encoding='utf-8')

          km = Path('docs/KNOWLEDGE_MAP.md')
          text = km.read_text(encoding='utf-8')
          text = text.replace('**Current checkpoint:** 161  ', '**Current checkpoint:** 162  ', 1)
          text = text.replace('**Active development branch:** `v1-autonomous-live-experiment-launcher`  ', '**Active development branch:** `v1-frontend-spike`  ', 1)
          text = text.replace('**Active PR:** #23 -> `v1-frontend-spike`  ', '**Active PR:** none; PR #23 merged  ', 1)
          text = text.replace('**Promoted V1 integration branch:** `v1-frontend-spike` at Specification 017 preservation merge `4385b83b43582ff6466b519b4e96356d220c44bc`', '**Promoted V1 integration branch:** `v1-frontend-spike` at Specification 018 promotion merge `9fd2243c38a8f0f010396847f519e115d30b8f58`', 1)
          text = re.sub(
              r'Current branch relationship:\n\n```text\n.*?```',
              '''Current branch relationship:\n\n```text\npromoted integration head      9fd2243c38a8f0f010396847f519e115d30b8f58\nactive branch                  v1-frontend-spike\nactive PR                      none\nSpecification 015 PR           #13 closed without merge; preservation #14 merged\nSpecification 016 PR           #15 merged\nSpecification 017 PR           #16 closed without merge; preservation #22 merged\nSpecification 018 PR           #23 merged\nmain                           intentionally behind V1 application code except narrow launcher exposure\n```''',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('Specification 018 / Checkpoints 160-161\n    governed autonomous live-experiment launcher frozen, implemented, cross-platform validated, and end-to-end provider-free probe passed', 'Specification 018 / Checkpoints 160-162\n    governed autonomous live-experiment launcher frozen, implemented, cross-platform validated, end-to-end provider-free probe passed, and promoted to integration', 1)
          text = re.sub(
              r'## Current exact continuation\n\n```text\n.*?```',
              '''## Current exact continuation\n\n```text\nA. branch from promoted merge 9fd2243c38a8f0f010396847f519e115d30b8f58\nB. preregister the next recommendation/action-value experiment\nC. keep exact supplied-context provenance system-owned\nD. do not use partial Specification 017 scores to tune truth or gates\nE. freeze the new fixture/call plan/gates/checkpoint before implementation\nF. validate the exact provider-free implementation head\nG. authorize and launch only through Specification 018 after that head is green\n```''',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('161  governed autonomous launcher end-to-end provider-free gate passed', '161  governed autonomous launcher end-to-end provider-free gate passed\n162  governed autonomous launcher promoted to V1 integration', 1)
          km.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = re.sub(
              r'## Current development stage\n\n\*\*Prototype V0 is complete\. The project is in bounded V1 implementation and integration\.\*\*\n\n```text\n.*?```',
              '''## Current development stage\n\n**Prototype V0 is complete. The project is in bounded V1 implementation and integration.**\n\n```text\ncheckpoint            162\nactive branch         v1-frontend-spike\nactive PR             none\npromoted V1 head      9fd2243c38a8f0f010396847f519e115d30b8f58\ncurrent boundary      Specification 018 governed autonomous live-experiment\n                      launcher promoted to integration\n```''',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('docs/checkpoints/161_governed_autonomous_live_experiment_launcher_end_to_end_gate_passed.md\ndocs/specifications/018_v1_governed_autonomous_live_experiment_launcher.md', 'docs/checkpoints/162_governed_autonomous_launcher_promoted_to_integration.md\ndocs/checkpoints/161_governed_autonomous_live_experiment_launcher_end_to_end_gate_passed.md\ndocs/specifications/018_v1_governed_autonomous_live_experiment_launcher.md', 1)
          text = re.sub(
              r'## Exact continuation\n\n```text\n.*?```',
              '''## Exact continuation\n\n```text\n1. preregister the next recommendation/action-value experiment\n2. make exact supplied-context provenance system-owned\n3. preserve Specification 017 scientific truth without tuning from partial scores\n4. freeze the new fixture, gates, call plan, and checkpoint before implementation\n5. implement and validate provider-free\n6. authorize and launch through Specification 018 only after the exact head is green\n```''',
              text,
              count=1,
              flags=re.S,
          )
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Commit routing reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-checkpoint162-integration.yml
          git add README.md docs/CURRENT_STATE.md docs/KNOWLEDGE_MAP.md
          git commit -m 'Reconcile Specification 018 integration boundary'
          git push origin HEAD:v1-frontend-spike
