name: Reconcile Specification 015 freeze routing

on:
  push:
    branches: [v1-recommendation-action-value]
    paths:
      - .github/workflows/v1-recommendation-action-freeze-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-recommendation-action-value
          fetch-depth: 0

      - name: Apply deterministic freeze routing reconciliation
        run: python experiments/recommendation_action_value/reconcile_spec015_freeze.py

      - name: Commit reconciled routing and remove one-shot machinery
        shell: bash
        run: |
          rm .github/workflows/v1-recommendation-action-freeze-reconcile.yml
          rm experiments/recommendation_action_value/reconcile_spec015_freeze.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route frozen Specification 015 recommendation action boundary"
          git push origin HEAD:v1-recommendation-action-value
