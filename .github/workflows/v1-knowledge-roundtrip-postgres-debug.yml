name: V1 knowledge roundtrip PostgreSQL diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-knowledge-roundtrip-postgres-debug.yml

permissions:
  contents: write

jobs:
  diagnose-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run and persist PostgreSQL diagnostic
        shell: bash
        env:
          ADS_TEST_POSTGRES_URL: postgresql+psycopg://ads:ads@127.0.0.1:5432/ads_v1
        run: |
          set +e
          uv run --python 3.13 --locked pytest tests/integration/test_knowledge_interchange_roundtrip.py -q -vv > /tmp/roundtrip-postgres.log 2>&1
          CODE=$?
          set -e
          cp /tmp/roundtrip-postgres.log experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_POSTGRES_DIAGNOSTIC.txt
          printf '\nEXIT_CODE=%s\n' "$CODE" >> experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_POSTGRES_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_POSTGRES_DIAGNOSTIC.txt
          git commit -m "Record PostgreSQL roundtrip diagnostic" || true
          git push
          exit "$CODE"
