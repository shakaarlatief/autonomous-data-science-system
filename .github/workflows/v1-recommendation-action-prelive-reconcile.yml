name: Reconcile Specification 015 pre-live boundary

# Armed after creation so the push-triggered one-shot reconciliation can run.
on:
  push:
    branches: [v1-recommendation-action-value]
    paths:
      - .github/workflows/v1-recommendation-action-prelive-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-recommendation-action-value
          fetch-depth: 0

      - name: Reconcile provider-free pre-live boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text.rstrip() + "\n", encoding="utf-8")

          def replace_section(text, start, end, replacement):
              pattern = re.compile(rf"(?ms)^{re.escape(start)}\n.*?(?=^{re.escape(end)}\n)")
              if not pattern.search(text):
                  raise RuntimeError(f"section not found: {start!r} -> {end!r}")
              return pattern.sub(replacement.rstrip() + "\n\n", text, count=1)

