name: V1 autonomous live experiment launcher

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  authorize-and-dispatch:
    if: startsWith(github.event.issue.title, '[ADS LIVE] ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Validate frozen authorization and dispatch allowlisted workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADS_LIVE_REGISTRY: .github/ads_live_experiments.json
        run: python scripts/ads_live_experiment_launcher.py
