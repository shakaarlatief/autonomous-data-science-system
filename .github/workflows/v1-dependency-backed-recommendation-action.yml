name: V1 dependency-backed recommendation action value

on:
  workflow_dispatch:
  push:
    branches: [v1-dependency-backed-recommendation-value]
    paths:
      - src/ads_system/application/reasoning.py
      - src/ads_system/application/ports.py
      - src/ads_system/application/context_*.py
      - src/ads_system/application/horizon*.py
      - src/ads_system/infrastructure/runtime/**
      - experiments/dependency_backed_recommendation_action_value/**
      - experiments/reasoning_context_value/environment.py
      - tests/fixtures/reasoning/dependency_backed_recommendation_action_v1.json
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/fixtures/retrieval/selective_context_v1.json
      - tests/unit/test_dependency_backed_recommendation_action_harness.py
      - tests/unit/test_dependency_backed_recommendation_action_live_runner.py
      - tests/integration/test_dependency_backed_recommendation_action_value_vertical_slice.py
      - docs/research/029_dependency_backed_recommendation_value_design.md
      - docs/specifications/021_v1_dependency_backed_recommendation_action_value_vertical_slice.md
      - docs/checkpoints/174_specification_021_dependency_backed_recommendation_value_contract_frozen.md
      - docs/checkpoints/175_specification_021_provider_free_implementation_gate_cross_platform_passed.md
      - docs/checkpoints/176_specification_021_pre_live_boundary_frozen.md
      - docs/CURRENT_STATE.md
      - docs/KNOWLEDGE_MAP.md
      - docs/current_routing.json
      - README.md
      - .github/workflows/v1-dependency-backed-recommendation-action.yml
      - .github/workflows/v1-dependency-backed-recommendation-action-live.yml
  pull_request:
    branches: [v1-frontend-spike]
    paths:
      - src/ads_system/application/reasoning.py
      - src/ads_system/application/ports.py
      - src/ads_system/application/context_*.py
      - src/ads_system/application/horizon*.py
      - src/ads_system/infrastructure/runtime/**
      - experiments/dependency_backed_recommendation_action_value/**
      - experiments/reasoning_context_value/environment.py
      - tests/fixtures/reasoning/dependency_backed_recommendation_action_v1.json
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/fixtures/retrieval/selective_context_v1.json
      - tests/unit/test_dependency_backed_recommendation_action_harness.py
      - tests/unit/test_dependency_backed_recommendation_action_live_runner.py
      - tests/integration/test_dependency_backed_recommendation_action_value_vertical_slice.py
      - docs/research/029_dependency_backed_recommendation_value_design.md
      - docs/specifications/021_v1_dependency_backed_recommendation_action_value_vertical_slice.md
      - docs/checkpoints/174_specification_021_dependency_backed_recommendation_value_contract_frozen.md
      - docs/checkpoints/175_specification_021_provider_free_implementation_gate_cross_platform_passed.md
      - docs/checkpoints/176_specification_021_pre_live_boundary_frozen.md
      - docs/CURRENT_STATE.md
      - docs/KNOWLEDGE_MAP.md
      - docs/current_routing.json
      - README.md
      - .github/workflows/v1-dependency-backed-recommendation-action.yml
      - .github/workflows/v1-dependency-backed-recommendation-action-live.yml

permissions:
  contents: read

jobs:
  provider-free-spec021:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Verify live provider credential is absent
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Ordinary Specification 021 CI must not receive OPENAI_API_KEY."
            exit 1
          fi
      - name: Verify Specification 021 has no repository authorization yet
        shell: bash
        run: |
          if grep -qi 'spec021' .github/ads_live_experiments.json; then
            echo "Specification 021 authorization must remain absent until the exact live source is frozen."
            exit 1
          fi
      - name: Verify application and domain layers remain provider neutral
        shell: bash
        run: |
          if grep -R -nE '(^|[[:space:]])(from|import)[[:space:]]+(agents|openai)([[:space:].]|$)' src/ads_system/application src/ads_system/domain; then
            echo "Provider SDK import crossed the application/domain boundary."
            exit 1
          fi
      - name: Run frozen provider-free Specification 021 gates
        run: >-
          uv run --python 3.13 --locked python -m pytest
          tests/unit/test_dependency_backed_recommendation_action_harness.py
          tests/unit/test_dependency_backed_recommendation_action_live_runner.py
          tests/integration/test_dependency_backed_recommendation_action_value_vertical_slice.py
          -q
      - name: Run existing V1 Python regression suite
        if: always()
        run: uv run --python 3.13 --locked python -m pytest -q
