name: Temporary Spec022 target run observer

on:
  push:
    branches: [main]
    paths:
      - .github/_tmp_spec022_observer.trigger

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  locate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: cf5893d74fefa699296842b0a48326a9cb50161c
      ISSUE_NUMBER: '69'
    steps:
      - name: Locate exact frozen target run
        shell: bash
        run: |
          set -euo pipefail
          gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/v1-methodological-navigation-coverage-live.yml/runs" \
            -f event=workflow_dispatch \
            -f per_page=20 > /tmp/runs.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path('/tmp/runs.json').read_text())
          source = os.environ['SOURCE_SHA']
          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('event') == 'workflow_dispatch'
              and run.get('head_sha') == source
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one frozen-source target run, found {len(matches)}')
          run = matches[0]
          Path('/tmp/comment.txt').write_text(
              'Spec022 target observed. '
              f"run_id=`{run['id']}`; status=`{run['status']}`; "
              f"conclusion=`{run.get('conclusion')}`; head_sha=`{run['head_sha']}`; "
              f"attempt=`{run['run_attempt']}`.\n",
              encoding='utf-8',
          )
          PY
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.txt
