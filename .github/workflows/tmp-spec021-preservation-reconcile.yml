name: Temporary Specification 021 preservation reconciliation

on:
  push:
    branches:
      - v1-spec021-negative-result-preservation
    paths:
      - .github/spec021-preservation-reconcile.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-spec021-negative-result-preservation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconcile preservation routing
        run: python scripts/tmp_reconcile_spec021_preservation.py
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CURRENT_STATE.md docs/KNOWLEDGE_MAP.md docs/OPEN_QUESTIONS.md docs/MAJOR_CHANGES.md docs/current_routing.json
          git diff --cached --exit-code && { echo "Expected reconciliation diff was empty"; exit 1; } || true
          git commit -m "Reconcile Specification 021 preservation routing"
          git push origin HEAD:v1-spec021-negative-result-preservation
