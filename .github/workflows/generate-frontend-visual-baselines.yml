name: Generate frontend visual baselines

on:
  push:
    branches: [v1-frontend-spike]
    paths:
      - .github/workflows/generate-frontend-visual-baselines.yml

permissions:
  contents: write

# Temporary bootstrap workflow. Remove after canonical baselines are committed.
jobs:
  generate-baselines:
    name: Generate canonical Playwright screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate canonical visual baselines
        env:
          VISUAL_REGRESSION: '1'
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Commit canonical visual baselines
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Visual baselines are already current"
            exit 0
          fi
          git commit -m "Add canonical frontend visual baselines"
          git push origin HEAD:v1-frontend-spike
