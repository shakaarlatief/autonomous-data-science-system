name: V1 persistence tooling spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/architecture_spikes/tooling_sqlalchemy_core_alembic_spike.py
      - .github/workflows/v1-persistence-tooling-spike.yml

permissions:
  contents: write

jobs:
  tooling-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install candidate persistence tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "SQLAlchemy==2.0.52"
          "Alembic==1.19.0"
          "psycopg[binary]>=3.2,<4"

      - name: Run SQLite tooling gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/architecture_spikes/tooling_sqlalchemy_core_alembic_spike.py \
            | tee /tmp/tooling-sqlite.txt

      - name: Run PostgreSQL tooling gate
        env:
          ADS_TOOLING_DB_URL: postgresql+psycopg://ads:ads@127.0.0.1:5432/ads
        shell: bash
        run: |
          set -o pipefail
          python experiments/architecture_spikes/tooling_sqlalchemy_core_alembic_spike.py \
            | tee /tmp/tooling-postgres.txt

      - name: Persist successful tooling evidence
        if: success()
        shell: bash
        run: |
          cat > experiments/architecture_spikes/V1_PERSISTENCE_TOOLING_RESULT.md <<'EOF'
          # V1 Persistence Tooling Spike Result

          **Status:** PASS  
          **Generated by:** GitHub Actions `V1 persistence tooling spike` workflow  
          **Scope:** SQLAlchemy Core + Alembic viability for Specification 001 on SQLite and PostgreSQL

          ## SQLite

          ```text
          EOF
          cat /tmp/tooling-sqlite.txt >> experiments/architecture_spikes/V1_PERSISTENCE_TOOLING_RESULT.md
          cat >> experiments/architecture_spikes/V1_PERSISTENCE_TOOLING_RESULT.md <<'EOF'
          ```

          ## PostgreSQL

          ```text
          EOF
          cat /tmp/tooling-postgres.txt >> experiments/architecture_spikes/V1_PERSISTENCE_TOOLING_RESULT.md
          cat >> experiments/architecture_spikes/V1_PERSISTENCE_TOOLING_RESULT.md <<'EOF'
          ```

          ## Interpretation boundary

          This spike validates the persistence-tooling seam, including SQLite STRICT tables, connection-level foreign-key enforcement, application transactions, dialect-specific FTS isolation, portable UUID storage, named constraints, Alembic migration behavior, and PostgreSQL execution of the same Core metadata model.

          It does not yet define the complete production schema or authorize use of SQLAlchemy ORM as the domain model.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/architecture_spikes/V1_PERSISTENCE_TOOLING_RESULT.md
          if git diff --cached --quiet; then
            echo "Tooling result already current."
          else
            git commit -m "Record passing V1 persistence tooling spike"
            git push
          fi
