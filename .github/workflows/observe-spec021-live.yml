name: Observe Specification 021 live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-spec021-live.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_ISSUE: '56'
      PRESERVE_WORKFLOW: preserve-spec021-live.yml
    steps:
      - name: Inspect latest preservation helper run
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${PRESERVE_WORKFLOW}/runs?per_page=10")"
          run_id="$(printf '%s' "${runs_json}" | jq -r '.workflow_runs[0].id // empty')"
          if [ -z "${run_id}" ]; then
            gh issue comment "${LAUNCH_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "Specification 021 preservation observer found no preservation-helper run."
            exit 1
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          status="$(printf '%s' "${run_json}" | jq -r '.status')"
          conclusion="$(printf '%s' "${run_json}" | jq -r '.conclusion // "null"')"
          head_sha="$(printf '%s' "${run_json}" | jq -r '.head_sha')"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" --jq '[.jobs[] | {id, name, status, conclusion}]')"
          gh issue comment "${LAUNCH_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Specification 021 preservation-helper status. run=\`${run_id}\`; head=\`${head_sha}\`; status=\`${status}\`; conclusion=\`${conclusion}\`; jobs=\`${jobs}\`."
