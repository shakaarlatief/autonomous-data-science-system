name: Inspect Specification 021 reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-spec021-live.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_ISSUE: '56'
      WORKFLOW_FILE: observe-spec021-live.yml
    steps:
      - name: Report prior reconciliation run
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=10")"
          prior="$(printf '%s' "${runs}" | jq -r '.workflow_runs[1].id // empty')"
          if [ -z "${prior}" ]; then
            gh issue comment "${LAUNCH_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "No prior Specification 021 reconciliation run found."
            exit 1
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior}")"
          status="$(printf '%s' "${run}" | jq -r '.status')"
          conclusion="$(printf '%s' "${run}" | jq -r '.conclusion // "null"')"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior}/jobs?filter=latest&per_page=100" --jq '[.jobs[] | {id,name,status,conclusion}]')"
          gh issue comment "${LAUNCH_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Specification 021 reconciliation-helper status. run=\`${prior}\`; status=\`${status}\`; conclusion=\`${conclusion}\`; jobs=\`${jobs}\`."
