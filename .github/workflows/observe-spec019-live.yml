name: Observe Specification 019 governed live run

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    if: ${{ github.event.issue.title == '[ADS OBSERVE] spec019-system-provenance-001' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_WORKFLOW: v1-system-owned-provenance-recommendation-action-live.yml
      TARGET_REF: v1-spec019-system-provenance-live-source
      EXPECTED_SHA: 6b5e6237b738250458550f95c9f3a6b0d51e86ec
    steps:
      - name: Resolve exact dispatched run
        shell: bash
        run: |
          set -euo pipefail
          TARGET_RUN=''
          TARGET_SHA=''
          for _ in $(seq 1 30); do
            read -r TARGET_RUN TARGET_SHA < <(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" \
                --branch "$TARGET_REF" --event workflow_dispatch --limit 1 \
                --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"' 2>/dev/null || true
            )
            if [ -n "${TARGET_RUN:-}" ]; then
              break
            fi
            sleep 2
          done
          test -n "$TARGET_RUN"
          test "$TARGET_SHA" = "$EXPECTED_SHA"
          echo "TARGET_RUN=$TARGET_RUN" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Specification 019 observer found target run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}; source=\`$TARGET_SHA\`. Waiting for completion."
      - name: Wait for exact live run
        shell: bash
        run: |
          set +e
          gh run watch "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          WATCH_EXIT=$?
          set -e
          RUN_JSON="$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,databaseId)"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN_JSON")"
          SHA="$(jq -r '.headSha' <<<"$RUN_JSON")"
          test "$SHA" = "$EXPECTED_SHA"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Specification 019 target run completed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}; source=\`$SHA\`; status=\`$STATUS\`; conclusion=\`${CONCLUSION:-none}\`; watch_exit=\`$WATCH_EXIT\`."
