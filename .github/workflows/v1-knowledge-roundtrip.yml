name: V1 governed knowledge roundtrip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - migrations/**
      - src/ads_system/application/knowledge_interchange.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/interchange/**
      - src/ads_system/infrastructure/persistence/**
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/integration/test_knowledge_interchange_roundtrip.py
      - schemas/reusable_knowledge_bundle_v1.schema.json
      - .github/workflows/v1-knowledge-roundtrip.yml

permissions:
  contents: write

jobs:
  sqlite-roundtrip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run SQLite governed knowledge roundtrip
        run: uv run --python 3.13 --locked pytest tests/integration/test_knowledge_interchange_roundtrip.py -q

  postgres-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run PostgreSQL governed knowledge roundtrip
        env:
          ADS_TEST_POSTGRES_URL: postgresql+psycopg://ads:ads@127.0.0.1:5432/ads_v1
        run: uv run --python 3.13 --locked pytest tests/integration/test_knowledge_interchange_roundtrip.py -q

  persist-status:
    if: always()
    needs: [sqlite-roundtrip, postgres-roundtrip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Persist roundtrip gate status
        shell: bash
        env:
          SQLITE_RESULT: ${{ needs.sqlite-roundtrip.result }}
          POSTGRES_RESULT: ${{ needs.postgres-roundtrip.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$SQLITE_RESULT" == "success" && "$POSTGRES_RESULT" == "success" ]]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi
          cat > experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_STATUS.md <<EOF
          # V1 Governed Knowledge Roundtrip Status

          **Status:** $STATUS  
          **Generated by:** GitHub Actions \`V1 governed knowledge roundtrip\` workflow  
          **Source commit:** \`$SOURCE_SHA\`

          \`\`\`text
          SQLite matrix: $SQLITE_RESULT
          PostgreSQL 18: $POSTGRES_RESULT
          \`\`\`
          EOF

          if [[ "$STATUS" == "PASS" ]]; then
            cat > experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_RESULT.md <<EOF
          # V1 Governed Knowledge Roundtrip Result

          **Status:** PASS  
          **Generated by:** GitHub Actions \`V1 governed knowledge roundtrip\` workflow  
          **Source commit:** \`$SOURCE_SHA\`  
          **Scope:** Candidate import, explicit acceptance, accepted snapshot export, migration compatibility, and historical revision pinning

          Validated on SQLite under Linux and Windows and on PostgreSQL 18:

          \`\`\`text
          IR-01  PASS  migration 0001 relation/current semantics preserved through migration 0002
          IR-02  PASS  candidate import is idempotent and does not advance accepted authority
          IR-03  PASS  conflicting reuse of a durable revision identity is rejected
          IR-04  PASS  explicit acceptance advances accepted-current pointers
          IR-05  PASS  accepted snapshot validates, is trusted-only, deterministic, and reloadable
          IR-06  PASS  later candidate revision leaves current accepted revision unchanged
          IR-07  PASS  explicit R2 acceptance supersedes R1 while project Finding remains pinned to R1
          IR-08  PASS  current accepted snapshot exports R2 without pretending to be full history
          \`\`\`

          The representative methodological fixture remains test material. The gate converts a copy to CANDIDATE_SET inside isolated test databases and does not create accepted operational knowledge in the repository.

          This gate validates the governed persistence/interchange seam. It does not validate retrieval quality, FTS ranking, embeddings, reranking, MethodologicalHorizon construction, external-source ingestion, or the knowledge authoring UI.
          EOF
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_STATUS.md
          if [[ -f experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_RESULT.md ]]; then
            git add experiments/architecture_spikes/V1_KNOWLEDGE_ROUNDTRIP_RESULT.md
          fi
          if git diff --cached --quiet; then
            echo "Knowledge roundtrip status already current."
          else
            git commit -m "Record V1 governed knowledge roundtrip status"
            git push
          fi

      - name: Fail workflow after status persistence
        if: needs.sqlite-roundtrip.result != 'success' || needs.postgres-roundtrip.result != 'success'
        run: exit 1
