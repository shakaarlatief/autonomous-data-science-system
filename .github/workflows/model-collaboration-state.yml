name: Model collaboration state

on:
  workflow_dispatch:
  push:
    branches:
      - v1-multimodel-development-collaboration
    paths:
      - schemas/model_collaboration_thread_state_v1.schema.json
      - scripts/check_model_collaboration_state.py
      - tests/unit/test_model_collaboration_state.py
      - docs/model_collaboration/threads/**/STATE.json
      - docs/model_collaboration/threads/**/THREAD.md
      - docs/specifications/024_v1_model_collaboration_state_guard.md
      - .github/workflows/model-collaboration-state.yml
  pull_request:
    paths:
      - schemas/model_collaboration_thread_state_v1.schema.json
      - scripts/check_model_collaboration_state.py
      - tests/unit/test_model_collaboration_state.py
      - docs/model_collaboration/threads/**/STATE.json
      - docs/model_collaboration/threads/**/THREAD.md
      - docs/specifications/024_v1_model_collaboration_state_guard.md
      - .github/workflows/model-collaboration-state.yml

permissions:
  contents: read

jobs:
  validate-collaboration-state:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Validate guarded collaboration state
        run: uv run --python 3.13 --locked python scripts/check_model_collaboration_state.py
      - name: Run collaboration-state unit tests
        run: uv run --python 3.13 --locked python -m pytest -q tests/unit/test_model_collaboration_state.py
      - name: Assert current routing remains free of collaboration-lock fields
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          routing = json.loads(Path('docs/current_routing.json').read_text(encoding='utf-8'))
          forbidden = {'active_writer', 'target_write_owner', 'collaboration_state', 'collaboration_lock', 'lock_owner'}
          found = sorted(forbidden.intersection(routing))
          if found:
              raise SystemExit('current_routing.json contains forbidden collaboration-state fields: ' + ', '.join(found))
          PY
