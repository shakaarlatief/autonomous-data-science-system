name: Reconcile Specification 014 promotion

on:
  push:
    branches: [v1-reasoning-context-value]
    paths:
      - .github/workflows/v1-reasoning-context-value-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-reasoning-context-value
          fetch-depth: 0

      - name: Apply deterministic promotion reconciliation
        run: python experiments/reasoning_context_value/reconcile_spec014_promotion.py

      - name: Commit reconciled boundary and remove one-shot machinery
        shell: bash
        run: |
          rm .github/workflows/v1-reasoning-context-value-reconcile.yml
          rm experiments/reasoning_context_value/reconcile_spec014_promotion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Specification 014 live reasoning result"
          git push origin HEAD:v1-reasoning-context-value
