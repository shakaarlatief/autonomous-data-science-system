          def replace_section(text, start, end, replacement):
              pattern = re.compile(
                  rf"(?ms)^{re.escape(start)}\n.*?(?=^{re.escape(end)}\n)"
              )
              if not pattern.search(text):
                  raise RuntimeError(f"section not found: {start!r} -> {end!r}")
