name: V1 methodological navigation coverage

on:
  workflow_dispatch:
  push:
    branches: [v1-methodological-navigation-coverage-diagnostic]
    paths:
      - experiments/methodological_navigation_coverage/**
      - tests/fixtures/methodological_navigation/**
      - tests/unit/test_methodological_navigation_coverage_contract.py
      - tests/unit/test_methodological_navigation_coverage_dense_fastembed.py
      - tests/unit/test_methodological_navigation_coverage_runner.py
      - tests/unit/test_methodological_navigation_coverage_live_runner.py
      - tests/unit/test_methodological_navigation_coverage_live_workflow.py
      - tests/integration/test_methodological_navigation_coverage_vertical_slice.py
      - src/ads_system/application/horizon.py
      - src/ads_system/application/horizon_models.py
      - src/ads_system/application/reasoning.py
      - src/ads_system/application/retrieval.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/interchange/**
      - src/ads_system/infrastructure/persistence/**
      - src/ads_system/infrastructure/retrieval/**
      - src/ads_system/infrastructure/runtime/**
      - docs/specifications/022_v1_project_state_methodological_horizon_coverage_diagnostic.md
      - docs/checkpoints/188_specification_022_project_state_methodological_coverage_contract_frozen.md
      - docs/checkpoints/189_specification_022_provider_free_implementation_gate_passed.md
      - .github/workflows/v1-methodological-navigation-coverage.yml
      - .github/workflows/v1-methodological-navigation-coverage-live.yml
  pull_request:
    branches: [v1-frontend-spike]
    paths:
      - experiments/methodological_navigation_coverage/**
      - tests/fixtures/methodological_navigation/**
      - tests/unit/test_methodological_navigation_coverage_contract.py
      - tests/unit/test_methodological_navigation_coverage_dense_fastembed.py
      - tests/unit/test_methodological_navigation_coverage_runner.py
      - tests/unit/test_methodological_navigation_coverage_live_runner.py
      - tests/unit/test_methodological_navigation_coverage_live_workflow.py
      - tests/integration/test_methodological_navigation_coverage_vertical_slice.py
      - src/ads_system/application/horizon.py
      - src/ads_system/application/horizon_models.py
      - src/ads_system/application/reasoning.py
      - src/ads_system/application/retrieval.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/interchange/**
      - src/ads_system/infrastructure/persistence/**
      - src/ads_system/infrastructure/retrieval/**
      - src/ads_system/infrastructure/runtime/**
      - docs/specifications/022_v1_project_state_methodological_horizon_coverage_diagnostic.md
      - docs/checkpoints/188_specification_022_project_state_methodological_coverage_contract_frozen.md
      - docs/checkpoints/189_specification_022_provider_free_implementation_gate_passed.md
      - .github/workflows/v1-methodological-navigation-coverage.yml
      - .github/workflows/v1-methodological-navigation-coverage-live.yml

permissions:
  contents: read

jobs:
  provider-free-spec022:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Verify provider credential is absent
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Ordinary Specification 022 CI must not receive OPENAI_API_KEY."
            exit 1
          fi
      - name: Verify frozen experiment-only FastEmbed package
        run: >-
          uv run --python 3.13 --locked --with fastembed==0.8.0
          python -c "from importlib.metadata import version; assert version('fastembed') == '0.8.0'"
      - name: Run frozen Specification 022 provider-free gates
        run: >-
          uv run --python 3.13 --locked python -m pytest
          tests/unit/test_methodological_navigation_coverage_contract.py
          tests/unit/test_methodological_navigation_coverage_dense_fastembed.py
          tests/unit/test_methodological_navigation_coverage_runner.py
          tests/unit/test_methodological_navigation_coverage_live_runner.py
          tests/unit/test_methodological_navigation_coverage_live_workflow.py
          tests/integration/test_methodological_navigation_coverage_vertical_slice.py
          -q
      - name: Run existing V1 Python regression suite
        if: always()
        run: uv run --python 3.13 --locked python -m pytest -q
