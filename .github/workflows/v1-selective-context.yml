name: V1 selective methodological context

on:
  workflow_dispatch:
  push:
    branches: [v1-relevance-selective-context]
    paths:
      - src/ads_system/application/context_models.py
      - src/ads_system/application/context_selection.py
      - src/ads_system/application/horizon.py
      - src/ads_system/application/horizon_models.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/persistence/navigation_repository.py
      - src/ads_system/infrastructure/persistence/uow.py
      - src/ads_system/infrastructure/persistence/**
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/fixtures/retrieval/selective_context_v1.json
      - tests/integration/test_selective_methodological_context.py
      - tests/unit/test_context_selection.py
      - .github/workflows/v1-selective-context.yml
  pull_request:
    branches: [v1-frontend-spike]
    paths:
      - src/ads_system/application/context_models.py
      - src/ads_system/application/context_selection.py
      - src/ads_system/application/horizon.py
      - src/ads_system/application/horizon_models.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/persistence/navigation_repository.py
      - src/ads_system/infrastructure/persistence/uow.py
      - src/ads_system/infrastructure/persistence/**
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/fixtures/retrieval/selective_context_v1.json
      - tests/integration/test_selective_methodological_context.py
      - tests/unit/test_context_selection.py
      - .github/workflows/v1-selective-context.yml

permissions:
  contents: read

jobs:
  selective-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run frozen RH-C selective context gate
        run: uv run --python 3.13 --locked python -m pytest tests/integration/test_selective_methodological_context.py tests/unit/test_context_selection.py -q -s
      - name: Run existing V1 Python regression suite
        if: always()
        run: uv run --python 3.13 --locked python -m pytest -q
