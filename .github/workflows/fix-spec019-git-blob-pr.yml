name: Fix Specification 019 cross-platform Git blob verification

on:
  pull_request:
    branches: [v1-frontend-spike]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'v1-recommendation-action-value-system-provenance' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-recommendation-action-value-system-provenance
          fetch-depth: 1
      - name: Verify locked base fixture through Git object identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/system_owned_provenance_recommendation_action_value/harness.py')
          text = path.read_text(encoding='utf-8')
          if 'import subprocess\n' not in text:
              text = text.replace('import random\n', 'import random\nimport subprocess\n', 1)

          marker = '''def _git_blob_sha(raw_bytes: bytes) -> str:\n    header = f"blob {len(raw_bytes)}\\0".encode("utf-8")\n    return hashlib.sha1(header + raw_bytes).hexdigest()\n'''
          helper = '''def _git_blob_sha(raw_bytes: bytes) -> str:\n    header = f"blob {len(raw_bytes)}\\0".encode("utf-8")\n    return hashlib.sha1(header + raw_bytes).hexdigest()\n\n\ndef _repository_blob_sha(path: Path, *, repository_root: Path) -> str:\n    """Resolve tracked Git object identity without depending on checkout line endings."""\n\n    resolved_path = path.resolve()\n    resolved_root = repository_root.resolve()\n    try:\n        relative = resolved_path.relative_to(resolved_root)\n    except ValueError:\n        return _git_blob_sha(path.read_bytes())\n\n    completed = subprocess.run(\n        ["git", "rev-parse", f"HEAD:{relative.as_posix()}"],\n        cwd=resolved_root,\n        check=False,\n        capture_output=True,\n        text=True,\n    )\n    observed = completed.stdout.strip()\n    if completed.returncode == 0 and len(observed) == 40:\n        return observed\n    return _git_blob_sha(path.read_bytes())\n'''
          if marker not in text:
              raise RuntimeError('Git blob helper insertion point drifted')
          text = text.replace(marker, helper, 1)
          old = '    observed_blob = _git_blob_sha(base_bytes)\n'
          new = '    observed_blob = _repository_blob_sha(base_path, repository_root=root)\n'
          if old not in text:
              raise RuntimeError('base fixture blob verification point drifted')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile experiments/system_owned_provenance_recommendation_action_value/harness.py
      - name: Commit cross-platform fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-spec019-git-blob-pr.yml
          git add experiments/system_owned_provenance_recommendation_action_value/harness.py
          git commit -m 'Fix Specification 019 cross-platform blob verification'
          git push origin HEAD:v1-recommendation-action-value-system-provenance
