name: V1 persistence vertical slice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - alembic.ini
      - migrations/**
      - src/ads_system/**
      - tests/integration/**
      - .github/workflows/v1-persistence-vertical-slice.yml

permissions:
  contents: write

jobs:
  sqlite-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run SQLite production-slice integration test
        run: uv run --python 3.13 --locked pytest tests/integration/test_persistence_vertical_slice.py -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run PostgreSQL portability integration test
        env:
          ADS_TEST_POSTGRES_URL: postgresql+psycopg://ads:ads@127.0.0.1:5432/ads_v1
        run: uv run --python 3.13 --locked pytest tests/integration/test_persistence_vertical_slice.py -q

  persist-result:
    needs: [sqlite-integration, postgres-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record successful production-slice gate
        shell: bash
        run: |
          cat > experiments/architecture_spikes/V1_PRODUCTION_PERSISTENCE_SLICE_RESULT.md <<'EOF'
          # V1 Production Persistence Vertical Slice Result

          **Status:** PASS  
          **Generated by:** GitHub Actions `V1 persistence vertical slice` workflow  
          **Scope:** First production-quality application path behind Specifications 001-003

          Validated:

          ```text
          Alembic base migration from an empty database
          SQLite STRICT relational persistence on Linux and Windows
          PostgreSQL 18 execution through the same application ports
          stable knowledge asset identity
          immutable historical knowledge revision retrieval
          accepted-current revision advancement
          governance supersession state
          component persistence tied to an exact parent asset revision
          typed relation + current relation revision
          conditional rule representation owned by an exact knowledge revision
          project + Finding persistence
          exact Finding -> knowledge revision pinning
          cross-project reference integrity rejection
          SQLAlchemy UnitOfWork commit/rollback boundary
          ```

          This gate validates the first production persistence vertical slice, not the full Foundation 018 object model, retrieval-quality subsystem, frontend, execution scheduler, or complete methodological brain.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/architecture_spikes/V1_PRODUCTION_PERSISTENCE_SLICE_RESULT.md
          if git diff --cached --quiet; then
            echo "Production-slice result already current."
          else
            git commit -m "Record passing V1 production persistence slice"
            git push
          fi
