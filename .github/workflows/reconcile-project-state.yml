name: Reconcile project state

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile continuity and current state
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/CONTINUITY.md')
          s = p.read_text()
          s = s.replace('**Aligned development-method version:** 0.3  ', '**Aligned development-method version:** 0.4  ')
          s = s.replace('**Last reviewed:** 2026-08-19', '**Last reviewed:** 2026-08-20')
          s = s.replace('The current continuity procedure is aligned with Development Method version 0.3.', 'The current continuity procedure is aligned with Development Method version 0.4.')
          marker = 'A chat may contain many topics and many checkpoints while continuity remains healthy.'
          if '### Active development session' not in s:
              addition = marker + '''\n\n### Active development session\n\n```text\nDesign session: 02\nChatGPT project: Autonomous Data Science System\nSession title: 02 - Methodological Brain & Knowledge Units\n```\n\nThe previous design session was:\n\n```text\nDesign session: 01\nChatGPT project: Autonomous Data Science System\nSession title: 01 - Foundations & Checkpoint 0\n```\n\nEvery checkpoint created while this ChatGPT-based development process remains active must preserve the applicable `Design session`, `ChatGPT project`, and `Session title` fields under `docs/checkpoints/README.md`. Session provenance improves navigation and auditing, but repository state remains the source of truth across sessions.'''
              s = s.replace(marker, addition)
          if 'v0.4\nexplicit checkpoint metadata contract' not in s:
              marker2 = 'v0.3\npromotion audit + knowledge map + reconciliation + authority metadata\n+ concise current state + experiment ledgers + major-changes history\n'
              s = s.replace(marker2, marker2 + '\nv0.4\nexplicit checkpoint metadata contract + mechanical validation\n+ normalized historical checkpoint provenance + required ChatGPT session provenance\n')
          p.write_text(s)

          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          s = s.replace('**Checkpoint:** 102  ', '**Checkpoint:** 103  ')
          s = s.replace('and first candidate conceptual knowledge representation contract completed; adversarial representation review is the active design task  ', 'first candidate conceptual knowledge representation contract, and checkpoint/session-provenance repair completed; adversarial representation review is the active design task  ')
          if '## Active ChatGPT development context' not in s:
              marker = '**Execution mode:** Prototype V0 is closed; no further B0/B1/P0 treatment or V0 semantic-judge inference is authorized'
              addition = marker + '''\n\n## Active ChatGPT development context\n\n```text\nDesign session: 02\nChatGPT project: Autonomous Data Science System\nSession title: 02 - Methodological Brain & Knowledge Units\n```\n\nThis is interaction/provenance metadata. Repository artifacts remain authoritative for project reconstruction across chats.'''
              s = s.replace(marker, addition)
          old = 'Checkpoint metadata normalization tooling now exists for the legacy 000-099 records. The historical backfill should not be considered closed until the normalized repository state has been mechanically verified against the checkpoint metadata contract.'
          new = 'The checkpoint metadata repair is closed. Checkpoints `000` through `099` were normalized and validated in GitHub Actions commit `bae5b8d00fa5da16029afee790c1a6762dc6c0fc`. Checkpoints `100` through `102` were backfilled with Session 02 provenance in commit `ce6b029af78a33bb64f85377f5ff753f088ba190`. The current checkpoint contract requires the historical/authority core plus `Design session`, `ChatGPT project`, and `Session title`; see Checkpoint 103 and `docs/checkpoints/README.md`.'
          s = s.replace(old, new)
          cp103 = 'docs/checkpoints/103_checkpoint_metadata_normalization_and_session_provenance_closed.md\n'
          if cp103 not in s:
              s = s.replace('docs/checkpoints/102_candidate_conceptual_knowledge_representation_contract.md\n', 'docs/checkpoints/102_candidate_conceptual_knowledge_representation_contract.md\n' + cp103)
          p.write_text(s)
          PY
      - name: Validate checkpoints
        run: python scripts/check_checkpoint_metadata.py --all
      - name: Commit
        run: |
          if git diff --quiet -- docs/CONTINUITY.md docs/CURRENT_STATE.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONTINUITY.md docs/CURRENT_STATE.md
          git commit -m "Reconcile Session 02 continuity and current state"
          git push
