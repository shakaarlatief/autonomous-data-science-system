name: V1 first MethodologicalHorizon builder

on:
  workflow_dispatch:
  push:
    branches: [v1-semantic-retrieval]
    paths:
      - src/ads_system/application/horizon.py
      - src/ads_system/application/horizon_models.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/persistence/navigation_repository.py
      - src/ads_system/infrastructure/persistence/uow.py
      - src/ads_system/infrastructure/persistence/**
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/fixtures/retrieval/methodological_horizon_v1.json
      - tests/integration/test_methodological_horizon.py
      - .github/workflows/v1-methodological-horizon-builder.yml
  pull_request:
    branches: [v1-frontend-spike]
    paths:
      - src/ads_system/application/horizon.py
      - src/ads_system/application/horizon_models.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/persistence/navigation_repository.py
      - src/ads_system/infrastructure/persistence/uow.py
      - src/ads_system/infrastructure/persistence/**
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/fixtures/retrieval/methodological_horizon_v1.json
      - tests/integration/test_methodological_horizon.py
      - .github/workflows/v1-methodological-horizon-builder.yml

permissions:
  contents: read

jobs:
  first-horizon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run frozen RH-R and RH-A MethodologicalHorizon gate
        run: uv run --python 3.13 --locked python -m pytest tests/integration/test_methodological_horizon.py -q -s
      - name: Run existing V1 Python regression suite
        if: always()
        run: uv run --python 3.13 --locked python -m pytest -q
