name: Cockpit reintegration fidelity

on:
  push:
    branches:
      - v1-cockpit-design-exploration
    paths:
      - frontend/design-lab/cockpit-reintegration*
      - frontend/design-lab/cockpit-product-surface-study*
      - frontend/design-lab/cockpit-spatial-rail-study*
      - frontend/design-lab/cockpit-conversation-integration-study*
      - frontend/design-lab/cockpit-practical-workspace-study*
      - frontend/e2e/cockpit-reintegration*.spec.ts
      - frontend/design-lab/grid-world.css
      - frontend/design-lab/work-unit-grammar.css
      - frontend/design-lab/work-unit-grammar-lighting-controls.css
      - frontend/design-lab/work-unit-grammar-customizable.css
      - frontend/design-lab/work-unit-disposition-grammar.css
      - frontend/design-lab/work-unit-blocked-carrier.css
      - frontend/design-lab/work-unit-blocked-carrier-ring-swap.css
      - frontend/design-lab/work-unit-attention-priority.css
      - frontend/design-lab/work-unit-selection-state.css
      - frontend/design-lab/work-unit-detail-expansion.css
      - frontend/design-lab/work-unit-detail-expansion-x5-accepted.css
      - frontend/design-lab/work-unit-detail-expansion.js
      - frontend/design-lab/work-unit-detail-expansion-x5-accepted.js
      - frontend/design-lab/work-unit-grammar.js
      - frontend/design-lab/relation-class-grammar.css
      - docs/checkpoints/**
      - scripts/select_cockpit_verification.py
      - .github/workflows/cockpit-reintegration-fidelity.yml
  pull_request:
    paths:
      - frontend/design-lab/cockpit-reintegration*
      - frontend/design-lab/cockpit-product-surface-study*
      - frontend/design-lab/cockpit-spatial-rail-study*
      - frontend/design-lab/cockpit-conversation-integration-study*
      - frontend/design-lab/cockpit-practical-workspace-study*
      - frontend/e2e/cockpit-reintegration*.spec.ts
      - frontend/design-lab/work-unit-detail-expansion.css
      - frontend/design-lab/work-unit-detail-expansion-x5-accepted.css
      - frontend/design-lab/work-unit-detail-expansion.js
      - frontend/design-lab/work-unit-detail-expansion-x5-accepted.js
      - scripts/select_cockpit_verification.py
      - .github/workflows/cockpit-reintegration-fidelity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockpit-reintegration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > changed-files.txt
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-files.txt
            else
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > changed-files.txt
            fi
          fi
          echo "Changed files:"
          cat changed-files.txt || true

      - name: Select verification tier
        id: select
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python scripts/select_cockpit_verification.py --self-test
          args=(--event "$EVENT_NAME" --message "${COMMIT_MESSAGE:-}" --github-output "$GITHUB_OUTPUT")
          while IFS= read -r file; do
            [[ -n "$file" ]] && args+=(--changed-file "$file")
          done < changed-files.txt
          python scripts/select_cockpit_verification.py "${args[@]}"

      - name: Set up Node 24
        if: steps.select.outputs.mode != 'skip'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        if: steps.select.outputs.mode != 'skip'
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        if: steps.select.outputs.mode != 'skip'
        run: npm run build

      - name: Install Chromium
        if: steps.select.outputs.mode != 'skip'
        run: npx playwright install --with-deps chromium

      - name: Run full Cockpit browser verification
        if: steps.select.outputs.mode == 'full'
        shell: bash
        run: npx playwright test e2e/cockpit-reintegration*.spec.ts

      - name: Run narrowed Cockpit browser verification
        if: steps.select.outputs.mode != 'skip' && steps.select.outputs.mode != 'full'
        shell: bash
        run: npx playwright test ${{ steps.select.outputs.specs }}

      - name: Verification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Cockpit verification selection"
            echo
            echo "- Tier: ${{ steps.select.outputs.tier }}"
            echo "- Mode: ${{ steps.select.outputs.mode }}"
            echo "- Reason: ${{ steps.select.outputs.reason }}"
            echo "- Specs: \`${{ steps.select.outputs.specs }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: ${{ always() && steps.select.outputs.mode != 'skip' }}
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-reintegration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report
            frontend/test-results
