name: Observe Specification 018 launcher probe

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    if: ${{ github.event.issue.title == '[ADS OBSERVE] spec018-probe-001' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_WORKFLOW: v1-live-launcher-probe.yml
      TARGET_REF: v1-autonomous-live-experiment-launcher
      EXPECTED_SHA: 27e7bc84b5f63d65d43de9a5bd27d1fdc0677071
    steps:
      - name: Resolve latest exact probe run
        shell: bash
        run: |
          set -euo pipefail
          read -r TARGET_RUN TARGET_SHA < <(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_REF" --event workflow_dispatch --limit 1 \
              --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"'
          )
          test -n "$TARGET_RUN"
          test "$TARGET_SHA" = "$EXPECTED_SHA"
          gh run watch "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          CONCLUSION="$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$CONCLUSION" = 'success'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Specification 018 provider-free probe passed. Target run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}; source=\`$TARGET_SHA\`. Observer run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
