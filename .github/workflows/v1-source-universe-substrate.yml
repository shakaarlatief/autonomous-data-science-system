name: V1 source universe substrate

on:
  workflow_dispatch:
  pull_request:
    branches: [v1-frontend-spike]
    paths:
      - .github/workflows/v1-source-universe-substrate.yml
      - docs/source_universe/**
      - docs/specifications/023_v1_source_universe_substrate.md
      - docs/foundations/021_source_universe_artifact_integrity_and_evidence_provenance.md
      - docs/research/034_source_universe_and_evidence_substrate_architecture.md
      - migrations/**
      - src/ads_system/application/source_*.py
      - src/ads_system/domain/source_universe.py
      - src/ads_system/infrastructure/source_store.py
      - src/ads_system/infrastructure/persistence/source_*.py
      - tests/**source_universe*.py
      - tests/**source_artifact*.py
      - tests/**source_manifest*.py

permissions:
  contents: read

jobs:
  source-substrate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Verify provider credential is absent
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Source-substrate validation must remain provider-free."
            exit 1
          fi
      - name: Migrate clean SQLite registry to head
        run: uv run --python 3.13 --locked alembic upgrade head
      - name: Run source-substrate and inherited V1 regression suite
        run: uv run --python 3.13 --locked python -m pytest -q
      - name: Assert source-universe metadata contains no tracked source binaries
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(["git", "ls-files", "docs/source_universe"], text=True).splitlines()
          forbidden = {".pdf", ".epub", ".doc", ".docx", ".ppt", ".pptx", ".zip"}
          bad = [path for path in tracked if Path(path).suffix.lower() in forbidden]
          if bad:
              raise SystemExit("Tracked source binaries are forbidden under docs/source_universe: " + ", ".join(bad))
          PY
