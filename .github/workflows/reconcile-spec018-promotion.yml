          Path('docs/CURRENT_STATE.md').write_text('''# Current State\n\n**Checkpoint:** 161  \n**Date:** 2026-08-23  \n**Active development branch:** `v1-autonomous-live-experiment-launcher`  \n**Active PR:** #23 -> `v1-frontend-spike`  \n**Promoted V1 integration branch:** `v1-frontend-spike` at Specification 017 preservation merge `4385b83b43582ff6466b519b4e96356d220c44bc`  \n**Development stage:** Prototype V0 complete; bounded V1 has accepted project/object, persistence, methodological knowledge, Horizon/selective-context, real-reasoning, dependency-backed sequencing, and now governed autonomous live-experiment launch seams. Specification 017 remains preserved incomplete evidence and its recommendation/action implementation remains unpromoted.  \n**Final V0 classification:** STRONG FALSIFICATION OF THE CURRENT P0 DESIGN  \n**Immediate project priority:** validate and merge the bounded Specification 018 launcher, then preregister the next recommendation/action-value experiment with system-owned exact context provenance before any new provider call.\n\n## Active ChatGPT development context\n\n```text\nDesign session: 04\nChatGPT project: Autonomous Data Science System\nSession title: 04 - Selective Context Promotion & Reasoning Vertical Slice\n```\n\nRepository artifacts remain authoritative across chats. `main` intentionally trails V1 application development but hosts the narrowly exposed launcher control plane required for issue-triggered dispatch.\n\n---\n\n## Durable architecture\n\nPrototype V0 established the scaling rule:\n\n```text\nwhat the SYSTEM should remember\n    !=\nwhat the LLM should receive on every reasoning call\n```\n\nFoundation 018 separates Objects, Relations, Events, and Views. Foundation 019 establishes:\n\n```text\nKNOWN -> APPLICABLE -> RELEVANT -> RECOMMENDED -> REQUIRED / BLOCKING\n```\n\nFoundation 020 separates reusable methodological knowledge from project state, execution implementation, and presentation.\n\nAccepted technical/runtime boundaries remain D-028 through D-032. Specification 008 remains the promoted Project Cockpit interaction architecture. Specifications 012-014 remain the bounded accepted Horizon/selective-context/real-reasoning chain.\n\n---\n\n## Current evidence chain\n\n```text\nreusable methodological knowledge\n    -> retrieval\n    -> explained MethodologicalHorizon\n    -> applicability / missing-context handling\n    -> selective exact-revision MethodologicalContextPack\n    -> ADS-owned ReasoningRuntime\n    -> real reasoning evidence                         [SUPPORTED]\n    -> recommendation/action experiment 015            [FAIL, PRESERVED]\n    -> dependency-backed disposition diagnostic 016    [SUPPORTED]\n    -> relation-backed recommendation experiment 017   [INCOMPLETE, PRESERVED]\n    -> governed live-experiment launcher 018            [SUPPORTED]\n```\n\nSpecification 014 showed equal frozen reasoning quality for SELECTIVE and FULL_HORIZON while SELECTIVE used 66.56% fewer provider input tokens.\n\nSpecification 016 supported the bounded construct that DEFER-like sequencing needs a concrete represented activating dependency if deterministic separation from NOT_NOW is expected.\n\nSpecification 017 did not complete its matched live design. It remains without PROMOTE / SAFE / FAIL classification. The stable instrumentation lesson is:\n\n```text\nreasoning function / task profile\n    !=\nreusable knowledge stable-key provenance\n```\n\nThe next recommendation/action experiment must therefore keep exact supplied context provenance system-owned and model-owned recommendation content separate.\n\n---\n\n## Specification 018 accepted control-plane evidence\n\nExact implementation source:\n\n```text\n27e7bc84b5f63d65d43de9a5bd27d1fdc0677071\n```\n\nCross-platform provider-free CI:\n\n```text\nrun 32660168566\nUbuntu launcher tests   41 passed\nWindows launcher tests  41 passed\nUbuntu full V1 suite    103 passed, 2 skipped\nWindows full V1 suite   103 passed, 2 skipped\nprovider credential     absent\n```\n\nAutonomous end-to-end provider-free probe:\n\n```text\nrequest issue       31\nlauncher run        32660333663\nprobe run           32660340429\nprobe job           97245432893\nobserver issue      32\nobserver run        32660375449\nresult              GOVERNED_LAUNCHER_SUPPORTED\n```\n\nObserved transport:\n\n```text\nconnected GitHub interface\n    -> owner-created [ADS LIVE] issue\n    -> default-branch launcher\n    -> registry authorization\n    -> owner/source/CI/duplicate validation\n    -> allowlisted workflow_dispatch\n    -> provider-free probe\n    -> independent target checks\n    -> success\n```\n\nNo manual Actions UI click and no provider call were involved.\n\nAccepted boundary:\n\n```text\nissue transport != executable authorization\nlauncher authorization != provider credential\nlauncher validation != target-workflow validation\n```\n\nThe launcher may be used only for explicitly repository-authorized frozen experiments. Issue text cannot define executable commands, workflow/ref/SHA/model/prompt/secret configuration, or arbitrary dispatch inputs.\n\n---\n\n## Current non-selections\n\nStill deliberately open:\n\n```text\nfinal recommendation/action taxonomy and ranking policy\nproduction REQUIRED/BLOCKING semantics\nwhether DEFER and NOT_NOW become production enums\ncomplete dependency persistence schema\nwhether explicit methodological knowledge adds recommendation/action value beyond a strong generic reasoner\nnatural-language/project-state -> reasoning-function derivation\nopen-world proposal/action discovery\nmapping accepted recommendations to authoritative project objects/events\nautomatic project execution and human approval/escalation policy\nadmissibility/risk-sensitive assurance policy\nfinal provider/model and reasoning-effort policy\nmulti-agent/specialist architecture\nbackend/API, artifact/job, cloud/deployment architecture\nfinal frontend stack and Cockpit implementation details\n```\n\n---\n\n## Exact continuation\n\n```text\n1. finish canonical reconciliation for Checkpoint 161\n2. remove or disable the one-shot probe authorization and temporary observer/validation helpers on main\n3. validate the exact reconciled PR #23 head with provider-free gates\n4. merge PR #23 into v1-frontend-spike\n5. record the exact promoted merge boundary\n6. preregister the next recommendation/action-value experiment\n7. make exact supplied-context provenance system-owned\n8. implement and validate the exact provider-free experiment head\n9. add one exact repository-controlled launch authorization\n10. launch through Specification 018 rather than a manual Actions button\n11. make no new recommendation/action provider call before steps 6-9 are frozen and green\n```\n''', encoding='utf-8')

          Path('docs/KNOWLEDGE_MAP.md').write_text('''# Knowledge Map\n\n**Status:** Current routing index  \n**Authority:** Navigation only. This file points to authoritative or explanatory sources but does not replace them.  \n**Last reviewed:** 2026-08-23  \n**Current checkpoint:** 161  \n**Active development branch:** `v1-autonomous-live-experiment-launcher`  \n**Active PR:** #23 -> `v1-frontend-spike`  \n**Promoted V1 integration branch:** `v1-frontend-spike` at Specification 017 preservation merge `4385b83b43582ff6466b519b4e96356d220c44bc`\n\n## Start here\n\n```text\nREADME.md                         project overview and current evidence boundary\ndocs/CURRENT_STATE.md             present state and exact continuation\ndocs/KNOWLEDGE_MAP.md             routing/index layer\ndocs/VISION.md                    high-level system and product direction\ndocs/PRINCIPLES.md                accepted high-level design principles\ndocs/DECISIONS.md                 accepted project-level decisions\ndocs/OPEN_QUESTIONS.md            unresolved design/evaluation questions\ndocs/DEVELOPMENT_METHOD.md        checkpoint/promotion method\ndocs/CONTINUITY.md                continuation procedure\ndocs/MAJOR_CHANGES.md             selective structural history\n```\n\nCurrent branch relationship:\n\n```text\npromoted integration head      4385b83b43582ff6466b519b4e96356d220c44bc\nactive branch                  v1-autonomous-live-experiment-launcher\nactive PR                      #23 -> v1-frontend-spike\nSpecification 015 PR           #13 closed without merge; preservation #14 merged\nSpecification 016 PR           #15 merged\nSpecification 017 PR           #16 closed without merge; preservation #22 merged\nmain                           intentionally behind V1 application code except narrow launcher exposure\n```\n\n---\n\n## Current V1 progression\n\n```text\nFoundations 018-020\n    project objects / methodological navigation / reusable knowledge\n\nD-028 through D-031 / Checkpo