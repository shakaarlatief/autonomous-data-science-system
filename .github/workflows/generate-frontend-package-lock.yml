name: Generate frontend package lock

on:
  push:
    branches: [v1-frontend-spike]
    paths:
      - .github/workflows/generate-frontend-package-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    name: Generate npm package lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate lockfile from exact declared dependencies
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git commit -m "Freeze frontend npm dependency graph"
          git push origin HEAD:v1-frontend-spike
