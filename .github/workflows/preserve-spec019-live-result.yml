name: Preserve Specification 019 live result

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  preserve:
    if: ${{ startsWith(github.event.issue.title, '[ADS PRESERVE] spec019-live-32664534864') && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record preservation workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="Specification 019 preservation workflow started; run=\`${GITHUB_RUN_ID}\`."

      - name: Checkout exact feature branch
        uses: actions/checkout@v7
        with:
          ref: v1-recommendation-action-value-system-provenance
          fetch-depth: 1

      - name: Download and verify exact frozen artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9499756280'
          EXPECTED_ZIP_SHA256: '67cbee97ec644ed5075b71bedc5d50032b0edd526dc829217057ccb3c1361430'
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/spec019-live-32664534864.zip"
          TMP="$RUNNER_TEMP/spec019-live-32664534864"
          DEST="experiments/system_owned_provenance_recommendation_action_value/results/spec019-live-20260824-run-32664534864"

          test ! -e "$DEST"
          mkdir -p "$TMP" "$DEST"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ZIP"

          observed_zip_sha="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$observed_zip_sha" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$ZIP" -d "$TMP"

          cd "$TMP"
          sha256sum -c <<'EOF'
          3679d5d97bc42d444299487cad46832907c196d8467707a41abe47e737f5e73e  environment.sqlite
          90bc527540b59e91b9ecbf4dff72681956d2debcd783ca369bbac8ec26b8aad7  run_metadata.json
          cad11110a7343db1affa552094a9f9d4ccf0c0170c2bc413e22254b1a200ff25  reasoning_plan.json
          a31d80b54cd4fe1307cdb5d60b185aaad7bdd47e7cb6ebf3c80279379fb89fa  system_provenance_plan.json
          88af820916d9971039922318614642032c899374f05353f9fd37a32358263526  reasoner_attempts.jsonl
          2283e83a4f40131e4adf77b9d63fd8e6b2dffa10507238d979cf72b5b030acb  judge_plan.json
          5efad31dcbeae16987e32362186093fbbc8d27c98f12e63cef2b203283cc1698  judge_attempts.jsonl
          85befc90c086eec91ffcc819713d26fb653c2791514f13117313330a3d734a2  result.json
          2751ca0b9be02b598b6717a6e2b9d20e1c884c31c71c6dfdf56d24a23ef732c  RESULT.md
          EOF
          cd "$GITHUB_WORKSPACE"
          cp -a "$TMP/." "$DEST/"

          cat > "$DEST/ARTIFACT_MANIFEST.md" <<'EOF'
          # Specification 019 Live Artifact Manifest

          - Workflow run: `32664534864`
          - Frozen source: `6b5e6237b738250458550f95c9f3a6b0d51e86ec`
          - Artifact ID: `9499756280`
          - Artifact name: `v1-system-owned-provenance-recommendation-6b5e6237b738250458550f95c9f3a6b0d51e86ec-1`
          - Artifact ZIP SHA-256: `67cbee97ec644ed5075b71bedc5d50032b0edd526dc829217057ccb3c1361430`
          - Base fixture Git blob: `eac949c47a01878dcc47dcca1116493a02ba9805`
          - Overlay SHA-256: `c4e7f567ea24c96efa3c20a61e9ca66cd30f1b0bb2ee47d0ddc57eaafc28d08`

          Contained files were hash-checked before preservation:

          ```text
          3679d5d97bc42d444299487cad46832907c196d8467707a41abe47e737f5e73e  environment.sqlite
          90bc527540b59e91b9ecbf4dff72681956d2debcd783ca369bbac8ec26b8aad7  run_metadata.json
          cad11110a7343db1affa552094a9f9d4ccf0c0170c2bc413e22254b1a200ff25  reasoning_plan.json
          a31d80b54cd4fe1307cdb5d60b185aaad7bdd47e7cb6ebf3c80279379fb89fa  system_provenance_plan.json
          88af820916d9971039922318614642032c899374f05353f9fd37a32358263526  reasoner_attempts.jsonl
          2283e83a4f40131e4adf77b9d63fd8e6b2dffa10507238d979cf72b5b030acb  judge_plan.json
          5efad31dcbeae16987e32362186093fbbc8d27c98f12e63cef2b203283cc1698  judge_attempts.jsonl
          85befc90c086eec91ffcc819713d26fb653c2791514f13117313330a3d734a2  result.json
          2751ca0b9be02b598b6717a6e2b9d20e1c884c31c71c6dfdf56d24a23ef732c  RESULT.md
          ```
          EOF

      - name: Commit immutable result bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/system_owned_provenance_recommendation_action_value/results/spec019-live-20260824-run-32664534864
          git commit -m 'Preserve Specification 019 live result'
          git push origin HEAD:v1-recommendation-action-value-system-provenance

      - name: Record preservation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/36/comments" \
            -f body="Specification 019 raw live bundle preserved exactly at commit \`${commit_sha}\`; source=\`6b5e6237b738250458550f95c9f3a6b0d51e86ec\`; run=\`32664534864\`; artifact=\`9499756280\`; ZIP SHA-256=\`67cbee97ec644ed5075b71bedc5d50032b0edd526dc829217057ccb3c1361430\`."
