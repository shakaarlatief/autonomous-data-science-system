name: Preserve Specification 019 live result

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  preserve:
    if: ${{ startsWith(github.event.issue.title, '[ADS PRESERVE] spec019-live-32664534864') && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record preservation workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="Specification 019 preservation workflow started; run=\`${GITHUB_RUN_ID}\`."

      - name: Checkout exact feature branch
        uses: actions/checkout@v7
        with:
          ref: v1-recommendation-action-value-system-provenance
          fetch-depth: 1

      - name: Download and verify exact frozen artifact contents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9499756280'
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/spec019-live-32664534864.zip"
          TMP="$RUNNER_TEMP/spec019-live-32664534864"
          DEST="experiments/system_owned_provenance_recommendation_action_value/results/spec019-live-20260824-run-32664534864"

          test ! -e "$DEST"
          mkdir -p "$TMP" "$DEST"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ZIP"
          unzip -q "$ZIP" -d "$TMP"

          cd "$TMP"
          sha256sum -c <<'EOF'
          34ec9d90332a699e26fb743501353dc49f653a428cc3392666520c19ddce0d4e  system_owned_provenance_recommendation_action.sqlite3
          6d65ac267c230da7ab787cdcbab58e4402ef81672993a33f81bff1844fb7f43a  reasoning_plan.json
          f2c5dcc5979d8365abedf0070d2316cdc21966b5c9b07c8eb573cef450e3a0e2  system_provenance_plan.json
          21142e034ea8832c9a4de206b72c70978d6c44a96838645e7e4aea2afd00542e  reasoner_attempts.jsonl
          cfa82f04256b0899a15ebd0852f1cb947cd50ab7e89e0bb4e1748d32772f2d5d  judge_plan.json
          b9707b9adeef97c91fe5454d3e0a57519f001661605dc724a044a7f31883425e  judge_attempts.jsonl
          48c556868ebd284933fb4a74c7a0b8c9573c06eeda3990257cf80a0b2d35593d  result.json
          01d5d60fcb466bcfe4f8ea5e42d589f442276bb3ff7c07beacb909f4d372460a  RESULT.md
          EOF
          cd "$GITHUB_WORKSPACE"
          cp -a "$TMP/." "$DEST/"

          cat > "$DEST/ARTIFACT_MANIFEST.md" <<'EOF'
          # Specification 019 Live Artifact Manifest

          - Workflow run: `32664534864`
          - Frozen source: `6b5e6237b738250458550f95c9f3a6b0d51e86ec`
          - Artifact ID: `9499756280`
          - Artifact name: `v1-system-owned-provenance-recommendation-6b5e6237b738250458550f95c9f3a6b0d51e86ec-1`
          - Connector-observed artifact ZIP SHA-256: `c970a8493b6dddee3bc7cbe907febec823f90af6fe5bad503defecce57184079`
          - Base fixture Git blob: `eac949c47a01878dcc47dcca1116493a02ba9805`
          - Overlay SHA-256: `c4e7f567ea24c96efa3c20a61e9ca66cd30f1b0bb2ee47d0ddc57eaafc28d08`

          Preservation authority is the exact workflow run, artifact ID, frozen source, and verified hashes of every contained experiment file. GitHub may repackage the outer ZIP on separate downloads.

          ```text
          34ec9d90332a699e26fb743501353dc49f653a428cc3392666520c19ddce0d4e  system_owned_provenance_recommendation_action.sqlite3
          6d65ac267c230da7ab787cdcbab58e4402ef81672993a33f81bff1844fb7f43a  reasoning_plan.json
          f2c5dcc5979d8365abedf0070d2316cdc21966b5c9b07c8eb573cef450e3a0e2  system_provenance_plan.json
          21142e034ea8832c9a4de206b72c70978d6c44a96838645e7e4aea2afd00542e  reasoner_attempts.jsonl
          cfa82f04256b0899a15ebd0852f1cb947cd50ab7e89e0bb4e1748d32772f2d5d  judge_plan.json
          b9707b9adeef97c91fe5454d3e0a57519f001661605dc724a044a7f31883425e  judge_attempts.jsonl
          48c556868ebd284933fb4a74c7a0b8c9573c06eeda3990257cf80a0b2d35593d  result.json
          01d5d60fcb466bcfe4f8ea5e42d589f442276bb3ff7c07beacb909f4d372460a  RESULT.md
          ```
          EOF

      - name: Commit immutable result bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/system_owned_provenance_recommendation_action_value/results/spec019-live-20260824-run-32664534864
          git commit -m 'Preserve Specification 019 live result'
          git push origin HEAD:v1-recommendation-action-value-system-provenance

      - name: Record preservation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/36/comments" \
            -f body="Specification 019 raw live bundle preserved exactly at commit \`${commit_sha}\`; source=\`6b5e6237b738250458550f95c9f3a6b0d51e86ec\`; run=\`32664534864\`; artifact=\`9499756280\`; all contained file hashes verified."
