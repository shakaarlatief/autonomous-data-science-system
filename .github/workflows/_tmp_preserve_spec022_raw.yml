name: Temporary preserve Specification 022 raw artifact

on:
  workflow_run:
    workflows: ['V1 methodological navigation coverage live']
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/_tmp_preserve_spec022_raw.trigger

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  preserve:
    if: github.event_name == 'push' || github.event.workflow_run.id == 32815726116
    runs-on: ubuntu-latest
    env:
      TARGET_RUN_ID: '32815726116'
      TARGET_JOB_SOURCE_SHA: 'cf5893d74fefa699296842b0a48326a9cb50161c'
      TARGET_WORKFLOW_NAME: 'V1 methodological navigation coverage live'
      EXPECTED_ARTIFACT_NAME: 'v1-methodological-navigation-coverage-cf5893d74fefa699296842b0a48326a9cb50161c-1'
      PRESERVE_BRANCH: 'v1-methodological-navigation-coverage-diagnostic'
      DESTINATION: 'experiments/methodological_navigation_coverage/results/spec022-live-20260825-run-32815726116'
      ISSUE_NUMBER: '69'
    steps:
      - name: Checkout preservation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRESERVE_BRANCH }}
          fetch-depth: 0

      - name: Verify completed exact target and fetch artifact metadata
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}")"
          status="$(printf '%s' "$run_json" | jq -r '.status')"
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
          workflow_name="$(printf '%s' "$run_json" | jq -r '.name')"
          attempt="$(printf '%s' "$run_json" | jq -r '.run_attempt')"
          [ "$status" = 'completed' ] || { echo "Target run is not completed: $status"; exit 1; }
          [ "$head_sha" = "$TARGET_JOB_SOURCE_SHA" ] || { echo 'Target source SHA mismatch'; exit 1; }
          [ "$workflow_name" = "$TARGET_WORKFLOW_NAME" ] || { echo 'Target workflow mismatch'; exit 1; }
          [ "$attempt" = '1' ] || { echo 'Unexpected target run attempt'; exit 1; }

          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts")"
          match_count="$(printf '%s' "$artifacts" | jq --arg name "$EXPECTED_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
          [ "$match_count" = '1' ] || { echo "Expected exactly one unexpired artifact, found $match_count"; exit 1; }
          artifact_id="$(printf '%s' "$artifacts" | jq -r --arg name "$EXPECTED_ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id')"
          artifact_size="$(printf '%s' "$artifacts" | jq -r --arg name "$EXPECTED_ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .size_in_bytes')"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"
          echo "target_conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Download and hash opaque artifact archive
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spec022-preserve
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/spec022-preserve/artifact.zip
          digest="$(sha256sum /tmp/spec022-preserve/artifact.zip | awk '{print $1}')"
          echo "artifact_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Preserve extracted files without interpretation
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size }}
          TARGET_CONCLUSION: ${{ steps.artifact.outputs.target_conclusion }}
          ARTIFACT_SHA256: ${{ steps.archive.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          [ ! -e "$DESTINATION" ] || { echo "Destination already exists: $DESTINATION"; exit 1; }
          mkdir -p "$DESTINATION"
          unzip -q /tmp/spec022-preserve/artifact.zip -d "$DESTINATION"

          {
            echo '# Specification 022 Live Artifact Manifest'
            echo
            echo 'This directory was preserved from the GitHub Actions artifact before any scientific result content was opened or interpreted.'
            echo
            echo '```text'
            echo "target_run_id          ${TARGET_RUN_ID}"
            echo "target_workflow        ${TARGET_WORKFLOW_NAME}"
            echo "target_source_sha      ${TARGET_JOB_SOURCE_SHA}"
            echo "target_run_attempt     1"
            echo "target_conclusion      ${TARGET_CONCLUSION}"
            echo "artifact_id            ${ARTIFACT_ID}"
            echo "artifact_name          ${EXPECTED_ARTIFACT_NAME}"
            echo "artifact_size_bytes    ${ARTIFACT_SIZE}"
            echo "artifact_zip_sha256    ${ARTIFACT_SHA256}"
            echo '```'
            echo
            echo '## Contained-file SHA-256'
            echo
            echo '```text'
            find "$DESTINATION" -type f ! -name ARTIFACT_MANIFEST.md -print0 | sort -z | xargs -0 sha256sum
            echo '```'
          } > "$DESTINATION/ARTIFACT_MANIFEST.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DESTINATION"
          git commit -m "Preserve raw Specification 022 live artifact"
          git push origin "HEAD:${PRESERVE_BRANCH}"

      - name: Comment preservation provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.archive.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          preserved_sha="$(git rev-parse HEAD)"
          body="Spec022 raw artifact preserved before interpretation. target_run=\`${TARGET_RUN_ID}\`; artifact=\`${ARTIFACT_ID}\`; artifact_sha256=\`${ARTIFACT_SHA256}\`; preservation_commit=\`${preserved_sha}\`."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
