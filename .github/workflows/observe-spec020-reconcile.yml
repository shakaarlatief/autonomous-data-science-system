name: Observe Specification 020 reconciliation

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  observe:
    if: ${{ github.event.issue.title == '[ADS OBSERVE] reconcile-spec020' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve reconciliation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-spec020-result.yml/runs?event=issues&per_page=10" --jq '.workflow_runs[0] | {id,html_url,status,conclusion,head_sha,created_at} | @json')"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -f body="Specification 020 reconciliation run: \`${json}\`."
