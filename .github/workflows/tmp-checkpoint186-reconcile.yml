name: Temporary Checkpoint 186 reconciliation

on:
  push:
    branches:
      - v1-methodological-navigation-coverage-review
    paths:
      - .github/checkpoint186-reconcile.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-methodological-navigation-coverage-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconcile Checkpoint 186 routing
        run: python scripts/tmp_reconcile_checkpoint186.py
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CURRENT_STATE.md docs/KNOWLEDGE_MAP.md docs/current_routing.json docs/OPEN_QUESTIONS.md docs/MAJOR_CHANGES.md
          git diff --cached --exit-code && { echo "Expected reconciliation diff was empty"; exit 1; } || true
          git commit -m "Reconcile Checkpoint 186 review routing"
          git push origin HEAD:v1-methodological-navigation-coverage-review
