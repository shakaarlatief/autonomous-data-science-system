name: Run Specification 021 incomplete reconciliation by maintenance issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.issue.title == '[ADS MAINT] spec021-reconcile-178' && github.event.issue.body == 'authorization: RECONCILE_SPEC_021_178'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-dependency-backed-recommendation-value
          fetch-depth: 1
      - name: Reconcile Checkpoint 178
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_spec021_incomplete.py
          python scripts/check_current_routing.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/CURRENT_STATE.md docs/KNOWLEDGE_MAP.md docs/OPEN_QUESTIONS.md docs/current_routing.json
          git rm scripts/reconcile_spec021_incomplete.py .github/workflows/reconcile-spec021-incomplete.yml
          git commit -m 'Reconcile Specification 021 incomplete live boundary'
          git push origin HEAD:v1-dependency-backed-recommendation-value
