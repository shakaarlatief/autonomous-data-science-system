name: V1 reusable knowledge interchange

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - schemas/reusable_knowledge_bundle_v1.schema.json
      - src/ads_system/infrastructure/interchange/**
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/unit/test_knowledge_interchange.py
      - docs/specifications/004_v1_reusable_knowledge_interchange.md
      - .github/workflows/v1-knowledge-interchange.yml

permissions:
  contents: write

jobs:
  interchange-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Run reusable-knowledge interchange gates KI-01 through KI-10
        run: uv run --python ${{ matrix.python }} --locked pytest tests/unit/test_knowledge_interchange.py -q

  persist-result:
    needs: interchange-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Canonicalize representative fixture
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from ads_system.infrastructure.interchange.knowledge_bundle import load_bundle, dump_bundle

          path = Path("tests/fixtures/knowledge/reusable_knowledge_stress_v1.json")
          bundle = load_bundle(path)
          dump_bundle(bundle, path)
          PY
      - name: Persist successful interchange evidence
        shell: bash
        run: |
          cat > experiments/architecture_spikes/V1_KNOWLEDGE_INTERCHANGE_RESULT.md <<'EOF'
          # V1 Reusable Knowledge Interchange Result

          **Status:** PASS  
          **Generated by:** GitHub Actions `V1 reusable knowledge interchange` workflow  
          **Scope:** Executable validation evidence for Specification 004 candidate interchange contract

          The JSON + JSON Schema Draft 2020-12 interchange contract passed on Python 3.12, 3.13, and 3.14 under Linux and Windows.

          ```text
          KI-01  PASS  Draft 2020-12 schema self-validation
          KI-02  PASS  heterogeneous ten-asset representative bundle
          KI-03  PASS  unknown typed-property rejection
          KI-04  PASS  malformed UUID/stable-key rejection
          KI-05  PASS  malformed recursive rule-condition rejection
          KI-06  PASS  deterministic dump/load/dump byte stability
          KI-07  PASS  formatting-independent semantic digest
          KI-08  PASS  unique human-readable relation endpoint resolution
          KI-09  PASS  semantic duplicate-key rejection
          KI-10  PASS  bundle-kind/governance import safety
          ```

          The representative corpus includes Histogram, Missing Data, Temporal Validation, Random Forest, Prediction-Time Feature Eligibility, Class Imbalance, Prediction Moment, Bagging, ECDF, and Gradient-Boosted Trees. It remains BENCHMARK_FIXTURE/CANDIDATE material and is not accepted operational methodological knowledge.

          The committed benchmark fixture is canonicalized through the same deterministic application serializer used by KI-06/KI-07.

          This result validates representation/interchange structure and safety. It does not yet validate database import/export round-trip behavior, retrieval quality, an embedding model, reranking, or MethodologicalHorizon construction.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/knowledge/reusable_knowledge_stress_v1.json experiments/architecture_spikes/V1_KNOWLEDGE_INTERCHANGE_RESULT.md
          if git diff --cached --quiet; then
            echo "Interchange evidence and canonical fixture already current."
          else
            git commit -m "Record passing V1 reusable knowledge interchange gate"
            git push
          fi
