name: Preserve Specification 021 live raw artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preserve-spec021-live.yml

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '32727241852'
      ARTIFACT_NAME: v1-dependency-backed-recommendation-action-b589bad975880b2d3cccc3596fc82539b1b96577-1
      TARGET_BRANCH: v1-dependency-backed-recommendation-value
      DESTINATION: experiments/dependency_backed_recommendation_action_value/results/spec021-live-20260824-run-32727241852
      LAUNCH_ISSUE: '56'
    steps:
      - name: Checkout preservation target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Download and preserve raw artifact without interpretation
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "${DESTINATION}" ]; then
            preservation_sha="$(git rev-parse HEAD)"
            gh issue comment "${LAUNCH_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body "Specification 021 raw artifact was already preserved before interpretation. target_run=\`${SOURCE_RUN_ID}\`; preservation_head=\`${preservation_sha}\`; path=\`${DESTINATION}\`."
            exit 0
          fi
          mkdir -p /tmp/spec021-raw
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir /tmp/spec021-raw
          mkdir -p "${DESTINATION}"
          cp -a /tmp/spec021-raw/. "${DESTINATION}/"
          echo "Preserving raw files:"
          find "${DESTINATION}" -maxdepth 2 -type f -printf '%P\n' | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "${DESTINATION}"
          git commit -m "Preserve raw Specification 021 live artifact"
          preservation_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          gh issue comment "${LAUNCH_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
            --body "Specification 021 raw artifact preserved before interpretation. target_run=\`${SOURCE_RUN_ID}\`; artifact=\`9520249437\`; artifact_digest=\`sha256:b936fab44a17dc22fb9fe31dacdb6f09104a765fcb2223df8ef517338403fe77\`; preservation_head=\`${preservation_sha}\`; path=\`${DESTINATION}\`."
