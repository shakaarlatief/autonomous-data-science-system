name: V1 methodological navigation coverage live

on:
  workflow_dispatch:
    inputs:
      launch_id:
        description: 'Repository-authorized Specification 022 launch identifier'
        required: true
        type: string
      expected_source_sha:
        description: 'Exact repository-authorized frozen source SHA'
        required: true
        type: string
      confirmation:
        description: 'Frozen Specification 022 confirmation token'
        required: true
        type: string

permissions:
  contents: read

jobs:
  frozen-live-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESULT_DIR: experiments/methodological_navigation_coverage/generated/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact repository-authorized source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Verify frozen launch, source, and credential boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.launch_id }}" != "spec022-methodological-navigation-coverage-001" ]; then
            echo "Unexpected Specification 022 launch identifier."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "RUN_SPEC_022_FROZEN" ]; then
            echo "Frozen Specification 022 confirmation mismatch."
            exit 1
          fi
          if [ "${{ inputs.expected_source_sha }}" != "${GITHUB_SHA}" ]; then
            echo "Workflow source does not match the repository-authorized frozen SHA."
            exit 1
          fi
          if ! printf '%s' "${GITHUB_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Frozen source SHA is malformed."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is required for the explicit live workflow."
            exit 1
          fi
          echo "Frozen Specification 022 source: ${GITHUB_SHA}"

      - name: Validate live-capable implementation without provider calls
        env:
          OPENAI_API_KEY: ''
        run: >-
          uv run --python 3.13 --locked python -m pytest
          tests/unit/test_methodological_navigation_coverage_contract.py
          tests/unit/test_methodological_navigation_coverage_dense_fastembed.py
          tests/unit/test_methodological_navigation_coverage_runner.py
          tests/unit/test_methodological_navigation_coverage_live_runner.py
          tests/unit/test_methodological_navigation_coverage_live_workflow.py
          tests/integration/test_methodological_navigation_coverage_vertical_slice.py
          -q

      - name: Verify exact live dependency versions before execution
        env:
          OPENAI_API_KEY: ''
        run: >-
          uv run --python 3.13 --locked
          --with openai-agents==0.19.4
          --with fastembed==0.8.0
          python -c "from importlib.metadata import version; assert version('openai-agents') == '0.19.4'; assert version('fastembed') == '0.8.0'"

      - name: Execute frozen Specification 022 live diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESULT_DIR}"
          uv run --python 3.13 --locked \
            --with openai-agents==0.19.4 \
            --with fastembed==0.8.0 \
            python -m experiments.methodological_navigation_coverage.live_runner \
            --output-dir "${RESULT_DIR}"

      - name: Upload complete frozen result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-methodological-navigation-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 30
