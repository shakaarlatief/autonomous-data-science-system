name: V1 Python project tooling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - src/ads_system/**
      - tests/**
      - .github/workflows/v1-python-project-tooling.yml

permissions:
  contents: write

jobs:
  cross-platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Resolve and test
        shell: bash
        run: |
          uv lock
          uv run --python ${{ matrix.python }} --locked pytest

  persist-reproducibility-evidence:
    needs: cross-platform-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Lock, test, build, and export
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          uv sync --locked
          uv run --locked pytest
          uv build --no-sources
          uv export --format pylock.toml --output-file /tmp/pylock.toml
          test -s /tmp/pylock.toml

      - name: Persist successful evidence and lockfile
        shell: bash
        run: |
          cat > experiments/architecture_spikes/V1_PYTHON_PROJECT_TOOLING_RESULT.md <<'EOF'
          # V1 Python Project Tooling Result

          **Status:** PASS  
          **Generated by:** GitHub Actions `V1 Python project tooling` workflow  
          **Scope:** Reproducible project/dependency/build foundation for the V1 application package

          Validated:

          ```text
          standard pyproject.toml project metadata
          uv 0.12.5 project management and cross-platform uv.lock
          Python 3.12 / 3.13 / 3.14 on Linux and Windows
          locked dependency synchronization
          pytest execution
          uv_build package build
          PEP 751 pylock.toml export compatibility
          source-layout import of ads_system
          ```

          The committed `uv.lock` is the reproducible development/application lockfile. `pyproject.toml` remains standards-based project metadata, and uv can export the resolution to standardized `pylock.toml` when interoperability requires it.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock experiments/architecture_spikes/V1_PYTHON_PROJECT_TOOLING_RESULT.md
          if git diff --cached --quiet; then
            echo "Project tooling evidence already current."
          else
            git commit -m "Record passing V1 Python project tooling gate"
            git push
          fi
