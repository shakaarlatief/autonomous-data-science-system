name: Knowledge map integrity

on:
  push:
    paths:
      - README.md
      - docs/README.md
      - docs/KNOWLEDGE_MAP.md
      - docs/CONTINUITY.md
      - docs/DEVELOPMENT_METHOD.md
      - docs/research/**
      - docs/foundations/**
      - docs/specifications/**
      - docs/checkpoints/**
      - docs/cockpit/**
      - docs/methodological_knowledge/**
      - docs/source_universe/**
      - docs/model_collaboration/**
      - scripts/check_knowledge_map.py
      - .github/workflows/knowledge-map-integrity.yml
  pull_request:
    paths:
      - README.md
      - docs/README.md
      - docs/KNOWLEDGE_MAP.md
      - docs/CONTINUITY.md
      - docs/DEVELOPMENT_METHOD.md
      - docs/research/**
      - docs/foundations/**
      - docs/specifications/**
      - docs/checkpoints/**
      - docs/cockpit/**
      - docs/methodological_knowledge/**
      - docs/source_universe/**
      - docs/model_collaboration/**
      - scripts/check_knowledge_map.py
      - .github/workflows/knowledge-map-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-map-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-knowledge-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exhaustive evergreen subject routing
        run: python scripts/check_knowledge_map.py
