name: V1 frontend spike

on:
  push:
    branches: [v1-frontend-spike]
    paths:
      - frontend/**
      - .github/workflows/v1-frontend-spike.yml
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/v1-frontend-spike.yml

permissions:
  contents: read

jobs:
  build-and-unit:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  browser-gate:
    name: Chromium browser gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: npm run e2e
      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            frontend/playwright-report
            frontend/test-results
