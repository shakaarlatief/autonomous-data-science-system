name: V1 relation-backed recommendation action value

on:
  workflow_dispatch:
  push:
    branches: [v1-recommendation-action-value-relation-backed]
    paths:
      - experiments/relation_backed_recommendation_action_value/**
      - experiments/reasoning_context_value/environment.py
      - src/ads_system/application/reasoning.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/runtime/**
      - tests/fixtures/reasoning/relation_backed_recommendation_action_v1.json
      - tests/fixtures/retrieval/selective_context_v1.json
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/unit/test_relation_backed_recommendation_action_harness.py
      - tests/integration/test_relation_backed_recommendation_action_value_vertical_slice.py
      - docs/research/024_relation_backed_recommendation_action_value_design.md
      - docs/specifications/017_v1_relation_backed_recommendation_action_value_vertical_slice.md
      - docs/checkpoints/156_relation_backed_recommendation_action_value_contract_frozen.md
      - docs/CURRENT_STATE.md
      - docs/KNOWLEDGE_MAP.md
      - README.md
      - .github/workflows/v1-relation-backed-recommendation-action-value.yml
  pull_request:
    branches: [v1-frontend-spike]
    paths:
      - experiments/relation_backed_recommendation_action_value/**
      - experiments/reasoning_context_value/environment.py
      - src/ads_system/application/reasoning.py
      - src/ads_system/application/ports.py
      - src/ads_system/infrastructure/runtime/**
      - tests/fixtures/reasoning/relation_backed_recommendation_action_v1.json
      - tests/fixtures/retrieval/selective_context_v1.json
      - tests/fixtures/knowledge/reusable_knowledge_stress_v1.json
      - tests/unit/test_relation_backed_recommendation_action_harness.py
      - tests/integration/test_relation_backed_recommendation_action_value_vertical_slice.py
      - docs/research/024_relation_backed_recommendation_action_value_design.md
      - docs/specifications/017_v1_relation_backed_recommendation_action_value_vertical_slice.md
      - docs/checkpoints/156_relation_backed_recommendation_action_value_contract_frozen.md
      - docs/CURRENT_STATE.md
      - docs/KNOWLEDGE_MAP.md
      - README.md
      - .github/workflows/v1-relation-backed-recommendation-action-value.yml

permissions:
  contents: read

jobs:
  provider-free-relation-backed-recommendation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Verify live provider credential is absent
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Ordinary Specification 017 CI must not receive OPENAI_API_KEY."
            exit 1
          fi
      - name: Run frozen provider-free Specification 017 gates
        run: >-
          uv run --python 3.13 --locked python -m pytest
          tests/unit/test_reasoning.py
          tests/unit/test_relation_backed_recommendation_action_harness.py
          tests/integration/test_relation_backed_recommendation_action_value_vertical_slice.py
          -q
      - name: Run existing V1 Python regression suite
        if: always()
        run: uv run --python 3.13 --locked python -m pytest -q
