name: V1 system-owned provenance recommendation action live

on:
  workflow_dispatch:
    inputs:
      launch_id:
        description: 'Exact repository-authorized launch identifier'
        required: true
        type: string
      expected_source_sha:
        description: 'Exact provider-free validated source SHA'
        required: true
        type: string
      confirmation:
        description: 'Exact frozen Specification 019 confirmation token'
        required: true
        type: string

permissions:
  contents: read

jobs:
  frozen-live-experiment:
    if: >-
      ${{
        inputs.launch_id == 'spec019-system-provenance-001' &&
        inputs.confirmation == 'RUN_SPEC_019_FROZEN'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ADS_SPEC019_CONFIRM: ${{ inputs.confirmation }}
      ADS_LAUNCH_ID: ${{ inputs.launch_id }}
      ADS_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      RESULT_DIR: experiments/system_owned_provenance_recommendation_action_value/generated/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Verify exact launch, source, confirmation, and credential boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/v1-recommendation-action-value-system-provenance" ]; then
            echo "Run Specification 019 only from the frozen experiment branch."
            exit 1
          fi
          if [ "${ADS_LAUNCH_ID:-}" != "spec019-system-provenance-001" ]; then
            echo "Specification 019 launch identifier is missing or incorrect."
            exit 1
          fi
          if [ "${ADS_SPEC019_CONFIRM:-}" != "RUN_SPEC_019_FROZEN" ]; then
            echo "Specification 019 confirmation is missing or incorrect."
            exit 1
          fi
          if [ -z "${ADS_EXPECTED_SOURCE_SHA:-}" ] || [ "${GITHUB_SHA}" != "${ADS_EXPECTED_SOURCE_SHA}" ]; then
            echo "Specification 019 source SHA does not match the repository authorization."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is required for the explicit live workflow."
            exit 1
          fi
          echo "Frozen Specification 019 source head: ${GITHUB_SHA}"
      - name: Validate frozen provider-free implementation before live calls
        run: >-
          uv run --python 3.13 --locked python -m pytest
          tests/unit/test_reasoning.py
          tests/unit/test_system_owned_provenance_recommendation_action_harness.py
          tests/integration/test_system_owned_provenance_recommendation_action_value_vertical_slice.py
          -q
      - name: Execute frozen Specification 019 live experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESULT_DIR}"
          uv run --python 3.13 --locked --with openai-agents==0.19.4 \
            python -m experiments.system_owned_provenance_recommendation_action_value.runner \
            --output-dir "${RESULT_DIR}"
      - name: Upload complete frozen result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-system-owned-provenance-recommendation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 30
