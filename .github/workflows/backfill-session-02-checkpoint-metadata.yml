name: Backfill Session 02 checkpoint metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-session-02-checkpoint-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Session 02 provenance to Checkpoints 100-102
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path("docs/checkpoints/100_missing_data_provenance_and_checkpoint_metadata_contract.md"),
              Path("docs/checkpoints/101_five_example_reusable_knowledge_stress_test_completed.md"),
              Path("docs/checkpoints/102_candidate_conceptual_knowledge_representation_contract.md"),
          ]
          fields = [
              "**Design session:** 02  ",
              "**ChatGPT project:** Autonomous Data Science System  ",
              "**Session title:** 02 - Methodological Brain & Knowledge Units",
          ]

          for path in targets:
              text = path.read_text(encoding="utf-8")
              if "**ChatGPT project:**" in text or "**Session title:**" in text:
                  raise SystemExit(f"Refusing ambiguous partial session metadata in {path}")

              lines = text.splitlines()
              authority_index = next(
                  (i for i, line in enumerate(lines[:30]) if line.startswith("**Authority:**")),
                  None,
              )
              if authority_index is None:
                  raise SystemExit(f"Authority metadata not found near top of {path}")

              lines[authority_index + 1:authority_index + 1] = fields
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Validate all checkpoint metadata
        run: python scripts/check_checkpoint_metadata.py --all

      - name: Commit Session 02 metadata backfill
        shell: bash
        run: |
          if git diff --quiet -- docs/checkpoints; then
            echo "No Session 02 checkpoint metadata changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints
          git commit -m "Backfill Session 02 checkpoint provenance"
          git push
