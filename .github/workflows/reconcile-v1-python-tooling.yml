name: Reconcile V1 Python tooling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-v1-python-tooling.yml
      - scripts/reconcile_v1_python_tooling.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile canonical documentation
        run: python scripts/reconcile_v1_python_tooling.py

      - name: Commit reconciled documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/DECISIONS.md docs/KNOWLEDGE_MAP.md docs/CURRENT_STATE.md docs/specifications/001_v1_sqlite_technical_architecture.md; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DECISIONS.md docs/KNOWLEDGE_MAP.md docs/CURRENT_STATE.md docs/specifications/001_v1_sqlite_technical_architecture.md
          git commit -m "Reconcile V1 Python tooling decision canonically"
          git push
