name: Checkpoint metadata

on:
  push:
    paths:
      - "docs/checkpoints/**"
      - "scripts/check_checkpoint_metadata.py"
      - ".github/workflows/checkpoint-metadata.yml"
  pull_request:
    paths:
      - "docs/checkpoints/**"
      - "scripts/check_checkpoint_metadata.py"
      - ".github/workflows/checkpoint-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate checkpoint metadata
        run: python scripts/check_checkpoint_metadata.py
