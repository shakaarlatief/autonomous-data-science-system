name: Temporary Checkpoint 188 reconciliation

on:
  push:
    branches:
      - v1-methodological-navigation-coverage-diagnostic
    paths:
      - .github/_tmp_checkpoint188.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-methodological-navigation-coverage-diagnostic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile Checkpoint 188 routing
        id: reconcile
        shell: bash
        run: |
          set +e
          python scripts/_tmp_reconcile_checkpoint188.py > /tmp/checkpoint188.log 2>&1
          code=$?
          cat /tmp/checkpoint188.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/checkpoint188.log .github/_tmp_checkpoint188_failure.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.reconcile.outputs.failed }}" = "true" ]; then
            git add .github/_tmp_checkpoint188_failure.txt
            git commit -m 'Record Checkpoint 188 reconciliation failure'
            git push origin HEAD:v1-methodological-navigation-coverage-diagnostic
            exit 1
          fi
          git add README.md docs/CURRENT_STATE.md docs/KNOWLEDGE_MAP.md docs/current_routing.json
          git diff --cached --quiet && { echo 'No reconciliation changes'; exit 1; }
          git commit -m 'Reconcile current routing to Checkpoint 188'
          git push origin HEAD:v1-methodological-navigation-coverage-diagnostic
