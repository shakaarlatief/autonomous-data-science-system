name: Reconcile Specification 020 supported result

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    if: ${{ github.event.issue.title == '[ADS RECONCILE] spec020-blocking-boundary-supported' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: 'v1-blocking-calibration-diagnostic'
      EXPECTED_HEAD: '0cdee78578375644bcd0625224bddf02ad7f79cf'
      GH_TOKEN: ${{ github.token }}
