name: Preserve Specification 021 replacement raw result

on:
  push:
    branches: [main]
    paths:
      - .github/preserve-spec021-replacement-raw.trigger

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: v1-dependency-backed-recommendation-value
      EXPECTED_BRANCH_HEAD: ee99bace2c7abfe796cc56bd0ef0f5dd5dfe38a9
      TARGET_RUN_ID: '32742426787'
      ARTIFACT_NAME: v1-dependency-backed-recommendation-action-575a3264ea39a10e35d769f9c54a2d1a13c28c08-1
      ARTIFACT_ID: '9525947445'
      ARTIFACT_DIGEST: sha256:05724335763fdbeb7eecb456f9662a95dd8d25579d82d360d29d306755648fa8
      DEST: experiments/dependency_backed_recommendation_action_value/results/spec021-live-20260824-run-32742426787
      AUDIT_ISSUE: '60'
    steps:
      - name: Checkout exact active experiment branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Verify preservation base and download exact artifact
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          if [ "$observed" != "$EXPECTED_BRANCH_HEAD" ]; then
            echo "Unexpected experiment branch head: $observed"
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          gh run download "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$DEST"
          python - <<'PY'
          import os
          from pathlib import Path

          dest = Path(os.environ['DEST'])
          expected = {
              'RESULT.md',
              'dependency_backed_recommendation_action.sqlite3',
              'judge_attempts.jsonl',
              'judge_plan.json',
              'reasoner_attempts.jsonl',
              'reasoning_plan.json',
              'result.json',
              'system_provenance_plan.json',
          }
          observed = {p.name for p in dest.iterdir() if p.is_file()}
          if observed != expected:
              raise SystemExit(f'unexpected artifact file set: {sorted(observed)}')
          PY

      - name: Commit raw files before interpretation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST"
          git diff --cached --quiet && { echo 'No raw artifact changes to preserve'; exit 1; }
          git commit -m 'Preserve Specification 021 replacement raw result'
          git push origin HEAD:"$TARGET_BRANCH"
          preserved="$(git rev-parse HEAD)"
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Specification 021 replacement raw artifact preserved before interpretation. target_run=\`$TARGET_RUN_ID\`; artifact_id=\`$ARTIFACT_ID\`; artifact_digest=\`$ARTIFACT_DIGEST\`; preservation_commit=\`$preserved\`."
