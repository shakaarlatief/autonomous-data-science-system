name: V1 reasoning context value live

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_SPEC_014_FROZEN to authorize the frozen live experiment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  frozen-live-experiment:
    if: ${{ inputs.confirmation == 'RUN_SPEC_014_FROZEN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESULT_DIR: experiments/reasoning_context_value/generated/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Verify explicit branch and credential boundary
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/v1-reasoning-context-value" ]; then
            echo "Run the frozen experiment only from v1-reasoning-context-value."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is required for the explicit live workflow."
            exit 1
          fi
          echo "Frozen source head: ${GITHUB_SHA}"
      - name: Validate locked provider-free implementation before live calls
        run: >-
          uv run --python 3.13 --locked python -m pytest
          tests/unit/test_reasoning.py
          tests/unit/test_reasoning_context_value_harness.py
          tests/integration/test_reasoning_context_value_vertical_slice.py
          -q
      - name: Execute frozen Specification 014 live experiment
        shell: bash
        run: |
          mkdir -p "${RESULT_DIR}"
          uv run --python 3.13 --with openai-agents==0.19.4 \
            python -m experiments.reasoning_context_value.runner \
            --output-dir "${RESULT_DIR}"
      - name: Upload complete frozen result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-reasoning-context-value-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 30
