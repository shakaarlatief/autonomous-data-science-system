name: Temporary Checkpoint 185 reconciliation

on:
  push:
    branches:
      - v1-frontend-spike
    paths:
      - .github/checkpoint185-reconcile.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-frontend-spike
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconcile Checkpoint 185 routing
        run: python scripts/tmp_reconcile_checkpoint185.py
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CURRENT_STATE.md docs/KNOWLEDGE_MAP.md docs/current_routing.json
          git diff --cached --exit-code && { echo "Expected reconciliation diff was empty"; exit 1; } || true
          git commit -m "Reconcile Checkpoint 185 integration routing"
          git push origin HEAD:v1-frontend-spike
