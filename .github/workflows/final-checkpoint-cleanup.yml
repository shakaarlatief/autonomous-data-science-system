name: Final checkpoint cleanup

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize and validate every checkpoint
        run: |
          python scripts/normalize_checkpoint_metadata.py --write --include-post-contract
          python scripts/check_checkpoint_metadata.py --all
      - name: Remove accidental Checkpoint 103 reference from contract-source sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          wrong = '''The full candidate contract and five conceptual encodings are preserved in:

```text
docs/checkpoints/102_candidate_conceptual_knowledge_representation_contract.md
docs/checkpoints/103_checkpoint_metadata_normalization_and_session_provenance_closed.md
```'''
          right = '''The full candidate contract and five conceptual encodings are preserved in:

```text
docs/checkpoints/102_candidate_conceptual_knowledge_representation_contract.md
```'''
          if wrong in s:
              s = s.replace(wrong, right, 1)
          elif right not in s:
              raise SystemExit('Expected CURRENT_STATE contract-source block not found')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- docs/checkpoints docs/CURRENT_STATE.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints docs/CURRENT_STATE.md
          git commit -m "Finalize normalized checkpoint headers"
          git push
