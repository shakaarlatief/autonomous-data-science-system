name: V1 architecture falsification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/architecture_spikes/v1_schema_spike.sql
      - experiments/architecture_spikes/v1_sqlite_architecture_falsification.py
      - experiments/architecture_spikes/v1_postgres_portability_spike.py
      - .github/workflows/v1-architecture-falsification.yml

permissions:
  contents: write

jobs:
  architecture-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PostgreSQL client binding
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Run SQLite gates FT-01 through FT-11
        id: sqlite
        shell: bash
        run: |
          set -o pipefail
          python experiments/architecture_spikes/v1_sqlite_architecture_falsification.py | tee /tmp/sqlite-gates.txt

      - name: Run PostgreSQL portability gate FT-12
        id: postgres
        env:
          ADS_POSTGRES_DSN: postgresql://ads:ads@127.0.0.1:5432/ads
        shell: bash
        run: |
          set -o pipefail
          python experiments/architecture_spikes/v1_postgres_portability_spike.py | tee /tmp/postgres-gate.txt

      - name: Persist successful gate evidence
        if: success()
        shell: bash
        run: |
          cat > experiments/architecture_spikes/V1_ARCHITECTURE_GATE_RESULT.md <<'EOF'
          # V1 Architecture Falsification Gate Result

          **Status:** PASS  
          **Generated by:** GitHub Actions `V1 architecture falsification` workflow  
          **Scope:** Reproducible execution evidence for Specification 001 architecture gates

          The committed SQLite falsification harness and PostgreSQL portability spike both completed successfully in CI.

          ## SQLite gates

          ```text
          EOF
          cat /tmp/sqlite-gates.txt >> experiments/architecture_spikes/V1_ARCHITECTURE_GATE_RESULT.md
          cat >> experiments/architecture_spikes/V1_ARCHITECTURE_GATE_RESULT.md <<'EOF'
          ```

          `FT-05: PASS_ARCHITECTURE_ONLY` validates the hybrid retrieval/index boundary with the deterministic toy semantic provider. It does not validate a production embedding model or reranker.

          ## PostgreSQL portability gate

          ```text
          EOF
          cat /tmp/postgres-gate.txt >> experiments/architecture_spikes/V1_ARCHITECTURE_GATE_RESULT.md
          cat >> experiments/architecture_spikes/V1_ARCHITECTURE_GATE_RESULT.md <<'EOF'
          ```

          FT-12 validates that the core durable identity, revision, component, relation, rule JSON, and project-to-knowledge reference patterns map to PostgreSQL without semantic redesign.

          ## Interpretation boundary

          This gate validates the technical architecture seam. It does not select the production embedding model, reranker, ORM, migration library, LLM provider, frontend/API framework, or other intentionally deferred subsystem choices.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/architecture_spikes/V1_ARCHITECTURE_GATE_RESULT.md
          if git diff --cached --quiet; then
            echo "Gate result already current."
          else
            git commit -m "Record passing V1 architecture falsification gate"
            git push
          fi
