name: Prototype V0 Tests

on:
  push:
    branches:
      - main
    paths:
      - "prototype_v0/**"
      - ".github/workflows/prototype-v0-tests.yml"
  pull_request:
    paths:
      - "prototype_v0/**"
      - ".github/workflows/prototype-v0-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype_v0/pyproject.toml

      - name: Install Prototype V0
        run: python -m pip install -e "./prototype_v0[dev,openai]"

      - name: Run tests
        working-directory: prototype_v0
        run: pytest

      - name: Generate development benchmark
        working-directory: prototype_v0
        run: python -m ads_v0.casegen --output generated/ci-development

      - name: Print benchmark self-test metrics
        working-directory: prototype_v0
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("generated/ci-development/evaluator_only/self_test_report.json")
              .read_text(encoding="utf-8")
          )
          print(json.dumps(report["metrics"], indent=2, sort_keys=True))
          PY
